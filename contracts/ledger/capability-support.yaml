    factor_group_id: paid_amount_metric_source
    question_family: paid_amount_change_explanation
    capability: data_quality_check
    grain:
      - day
      - month
      - baseline_window
    claim_type: metric_identity_and_quality_boundary
    business_evidence_state: quantifiable
    data_contract_state: contract_backed
    evidence_type: insufficient
    strength: high
    wording_limit: context
    backlog_refs:
      - timezone_policy
      - payment_status_and_dedup_contract
    wording_limit_reason: Current paid-order source binding, gross paid_amount basis, status boundary, and dedup policy are accepted; remaining time/status policy gaps must still be surfaced before strong claims.
    review_status: draft_pending_owner_review

