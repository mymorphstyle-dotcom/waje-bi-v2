contract_version: "0.1"
artifact: capability_support
review_status: draft
scope: Phase 1 representative support matrix for paid_amount factor groups.
storage_design: deferred_to_later_phase

source_refs:
  factor_ledger: contracts/ledger/factor-ledger.yaml
  backlog: contracts/backlog/missing-contracts.yaml
  metric_contract: contracts/metrics/paid-amount.metric.yaml
  prd_launch_matrix: docs/prd.md#21-launch-acceptance-matrix

question_families:
  - paid_amount_change_explanation
  - pattern_explanation
  - business_object_impact_review
  - revenue_health_review
  - segment_or_factor_attribution
  - anomaly_or_black_swan_review
  - custom_baseline_comparison
  - data_quality_or_evidence_review

capabilities:
  - pattern_scan
  - formula_decompose
  - payment_outcome_compare
  - joint_attribution
  - event_evidence
  - outlier_scan
  - outlier_contribution
  - segment_bridge
  - segment_contribution
  - data_quality_check

state_visibility:
  missing_contract: Support records use backlog_refs.
  unsupported_grain: Support records name supported and blocked grains through grain plus backlog_refs.
  out_of_scope_for_now: No representative support record is parked here yet; CF-09 reconciliation can add explicit scope decisions if a SSOT node is outside launch scope.

support_records:
