runtime_binding:
  binding_ref: contracts/runtime/clickhouse-analysis-bindings.yaml@20
  canonicalization_version: gameplay-decimal-v1
  release_membership: {policy: exact_dataset_set, dataset_ids: [gameplay, gameplay_channel]}
  overall: {dataset_id: gameplay, physical_table_prefix: gameplay_daily__, grain: [snapshot_id, load_revision, business_date, service_scope, gameplay], unique_key: [snapshot_id, load_revision, business_date, service_scope, gameplay]}
  channel: {dataset_id: gameplay_channel, physical_table_prefix: gameplay_channel_daily__, grain: [snapshot_id, load_revision, business_date, channel, service_scope, gameplay], unique_key: [snapshot_id, load_revision, business_date, channel, service_scope, gameplay]}
  source_load_manifest: {identity: content_addressed, checksum: sha256, row_content_hash: sha256_canonical_json, empty_channel_partition_status: no_data}
  claim_boundary:
    allowed_metric_family: gameplay_activity
    blocked_metric_aliases: [paid_amount, payment_amount, gameplay_paid_amount]
    blocked_claim_types: [paid_amount_attribution, causal, roi]

coverage:
  covered_metrics:
    - 玩法
    - 玩法游戏人数
    - 玩法渗透率
    - 游戏局数
    - 人均局数
    - 玩家下注次数
    - 玩家下注总额
    - 玩家人均下注次数
    - 玩家次均下注额
    - 玩家人均下注额
    - 系统抽水率
    - 玩法盈利
    - 盈利占比
    - 玩家下注额占比
  supported_grains:
    - day
    - gameplay
    - service_scope
    - channel_from_filename
  partial_or_proxy_metrics:
    ggr:
      available_fields:
        - 玩法盈利
      status: confirmed_metric_mapping
      wording_limit: quantified
    per_user_betting_or_ggr_context:
      available_fields:
        - 游戏人数
        - 玩法盈利
        - 玩家下注总额
      status: context_only_not_payment_arpu
      candidate_formulas:
        - 玩法盈利 / 游戏人数
        - 玩家下注总额 / 游戏人数
      wording_limit: candidate
      blocked_labels:
        - gameplay_payment_arpu
        - gameplay_paid_amount
        - paid_amount_contribution
  unavailable_without_new_source:
    - 玩法icon曝光数
    - 玩法icon点击率
    - 玩法付费率
    - 玩法付费金额
    - 玩法付费频次
    - 玩法单笔付费金额
    - 支付订单到玩法的明细归因链路

known_limits:
  - pending_owner_confirmation_for_gameplay_field_meanings
  - channel_dimension_is_inferred_from_filename_for_by_channel_files_with_literal_merge_only
  - duplicated_raw_header_service_fee_rake_columns_are_identical_in_profiled_2026_file_use_first_column
  - robot_cash_lost_raw_column_has_source_typo_chah_map_as_robot_cash_lost_raw
  - no_icon_exposure_or_click_fields
  - no_direct_payment_linkage_to_gameplay
  - no_hard_guess_for_missing_gameplay_payment_fields
  - payout_rate_deferred_by_business_decision
