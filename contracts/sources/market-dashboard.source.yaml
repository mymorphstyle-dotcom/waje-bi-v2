  - channel_dimension_is_inferred_from_filename_for_channel_dashboard_files_with_literal_merge_only
  - dashboard_has_daily_and_channel_daily_aggregates_but_no_joint_grain
  - aggregate_marketing_cost_is_not_campaign_budget_bid_or_spend_detail
  - aggregate_marketing_cost_cannot_support_roi_roas_cpa_or_net_impact
  - no_creative_ctr_cvr_fields
  - no_seo_geo_ranking_fields
  - no_referral_activity_fields
  - no_refund_reversal_fields
