  joint_analysis_boundary:
    reason_for_paid_order_detail: 大盘 supports daily and filename-channel aggregate metrics, but it does not support joint analysis across channel, region, device, amount bucket, payment method, user history, and order-level dedup.
    dashboard_allowed_use:
      - overall_daily_formula_component_review
      - channel_daily_single_dimension_review
      - source_reconciliation_against_paid_order_detail
    dashboard_blocked_use:
      - channel_x_region_x_device_joint_attribution
      - order_level_dedup_or_status_repair
      - payment_method_or_latency_diagnostics
      - user_level_first_pay_lifetime_reconstruction
  marketing_boundary:
    aggregate_cost_available: 投放成本
    allowed_use:
      - background_context_when_date_scope_match
      - candidate_mechanism_with_missing_contract_limitation
    blocked_use:
      - campaign_spend_proxy
      - exposure_or_control_proxy
      - roi_roas_cpa_claims
      - net_impact_or_confirmed_campaign_impact
    unavailable_without_new_source:
      - 投放预算
      - 出价
      - campaign 消耗
      - 素材 CTR
      - 素材 CVR
      - SEO 排名
      - GEO 排名
      - 用户推荐活动
  adjustment_boundary:
    refund_reversal_source: unavailable_without_new_source
    note: 提现字段不能替代 refund, reversal, chargeback, or cancellation adjustment contracts; current phase allows limitation wording only, not adjustment proxy.

known_limits:
