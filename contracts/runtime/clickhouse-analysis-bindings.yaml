      - "contracts/runtime/clickhouse-analysis-bindings.yaml#capability_inputs.evidence_reduce"
  anomaly_validation:
    business_name: 异常成立性验证
    semantics: 识别目标指标中超出常态波动的候选异常，并保留时间窗口、范围和敏感性边界。
    axis_kind: anomaly_detection
    target_metric_refs: [paid_amount]
    metric_refs: []
    dimension_refs: []
    context_source_refs: []
    capability_refs: [outlier_scan, change_point_scan, outlier_contribution]
    reconciliation_group: paid_amount_anomaly_validation
    selection_policy: user_or_evidence_triggered
    source_refs:
      - "contracts/capabilities/outlier-scan.yaml#outlier_scan"
      - "contracts/ssot/付费金额影响因子分析.mm#内外部因素"
  metric_coverage:
    business_name: 指标覆盖与完整性
    semantics: 核对目标指标在已固定数据集、窗口和粒度上的覆盖，将缺口绑定到受影响结论。
    axis_kind: data_quality
    target_metric_refs: [paid_amount]
    metric_refs: []
    dimension_refs: []
    context_source_refs: []
    capability_refs: [metric_coverage_profile]
    reconciliation_group: paid_amount_metric_coverage
    selection_policy: always
    source_refs:
      - "contracts/metrics/paid-amount.metric.yaml#paid_amount"
