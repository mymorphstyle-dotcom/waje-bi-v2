analysis_axis_catalog:
  change_validation:
    business_name: 变化验证
    semantics: 先查询目标窗口和已确认主基线，验证用户提出的上涨或下跌前提以及实际变化幅度。
    axis_kind: change_validation
    target_metric_refs: [paid_amount]
    metric_refs: []
    dimension_refs: []
    context_source_refs: []
    capability_refs: [compare_periods]
    reconciliation_group: paid_amount_primary_comparison
    selection_policy: primary_baseline_required
    source_refs:
      - "contracts/metrics/paid-amount.metric.yaml#paid_amount"
      - "contracts/ssot/付费金额影响因子分析.mm#付费金额"
  formula_tree:
    business_name: 公式因素拆解
    semantics: 沿已审阅的付费金额公式链检查人数、频次、单笔金额和支付成功率等组成因素。
    axis_kind: formula_tree
    target_metric_refs: [paid_amount]
    metric_refs: [paid_users, paid_orders, first_paid_users, paid_frequency, avg_order_amount, payment_success_rate]
    dimension_refs: []
    context_source_refs: []
    capability_refs: [formula_decompose]
    reconciliation_group: paid_amount_formula_tree
    selection_policy: all_contract_backed_formula_members
    source_refs:
      - "contracts/ssot/付费金额影响因子分析.mm#付费金额公式"
      - "contracts/ledger/factor-ledger.yaml#factor_groups.payment_order_metric_chain"
  dimension_localization:
    business_name: 维度定位
    semantics: 对目标指标当前合同允许的全部聚合维度做独立筛选，定位变化集中在哪些业务分群。
    axis_kind: dimension_localization
    target_metric_refs: [paid_amount]
    metric_refs: []
    dimension_refs: [channel, payment_method, country, region, city, device_brand, device_model, os, network_type]
    context_source_refs: []
    capability_refs: [candidate_dimension_screen, segment_contribution, segment_breakdown, segment_shift_compare, joint_attribution, user_mix_contribution, high_value_user_contribution]
    reconciliation_group: paid_amount_dimension_localization
    selection_policy: all_automatic_screening_dimensions
    source_refs:
      - "contracts/ssot/付费金额影响因子分析.mm#分布波动"
      - "contracts/dimensions/dimensions.yaml#dimensions"
  time_context:
    business_name: 时间背景
    semantics: 在主基线变化已经单独验证后，用时间序列和滚动参照补充判断当前变化是否异常或反复出现。
    axis_kind: time_context
    target_metric_refs: [paid_amount]
    metric_refs: []
    dimension_refs: []
    context_source_refs: []
    capability_refs: [metric_timeseries, rolling_window_compare, compare_period_phases, weekday_calendar_compare]
    reconciliation_group: paid_amount_time_context
    selection_policy: periodic_context_when_available
    source_refs:
      - "contracts/ssot/付费金额影响因子分析.mm#周期性"
      - "contracts/assumptions/payday.assumption.yaml#aggregate_payday_window_25_30"
  cross_source_context:
    business_name: 跨数据源业务关联
    semantics: 将付费金额及其核心结构指标与已审阅的玩法经营指标按业务日对齐，检查同期、领先或滞后关系及滚动稳定性；渠道面板用于排除全盘共同波动和渠道结构迁移的干扰。
    axis_kind: cross_source_context
    target_metric_refs: [paid_amount]
    metric_refs: [player_bet_amount, player_bet_count, player_avg_bet_amount, gameplay_users, gameplay_rounds, gameplay_profit, service_fee_rake]
    dimension_refs: [channel]
    context_source_refs: [gameplay, gameplay_channel]
    capability_refs: [cross_source_association, cross_source_panel_association]
    reconciliation_group: paid_amount_cross_source_context
    selection_policy: association_context_when_available
    source_refs:
      - "contracts/sources/gameplay.source.yaml#coverage.covered_metrics"
      - "contracts/ledger/capability-support.yaml#segment_gameplay_betting_structure"
  market_context:
    business_name: 大盘与渠道经营背景
    semantics: 将付费金额与大盘经营指标、渠道结构和跨来源对账放在同一候选分析轴中，检验全盘共同变化、渠道迁移和来源口径差异。
    axis_kind: market_context
    target_metric_refs: [paid_amount]
    metric_refs: [active_users, new_users, registrations, aggregate_marketing_cost, profit]
    dimension_refs: [channel]
    context_source_refs: []
    capability_refs: [market_health_compare, market_channel_context, source_reconciliation]
    reconciliation_group: paid_amount_market_context
    selection_policy: association_context_when_available
    source_refs:
