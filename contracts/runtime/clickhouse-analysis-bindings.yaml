  change_explanation:
    required_capabilities: [driver_decomposition]
    condition: components_present
    supported_question_families: [paid_amount_change_explanation, custom_baseline_comparison]
  pattern_attribution:
    required_capabilities: [candidate_dimension_screen]
    condition: dimensions_present
    supported_question_families: [pattern_explanation, segment_or_factor_attribution]
  event_impact:
    required_capabilities: [event_evidence]
    condition: event_context_requested
    supported_question_families: [business_object_impact_review]
