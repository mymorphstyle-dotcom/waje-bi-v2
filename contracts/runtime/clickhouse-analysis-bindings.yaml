    business_name: 支付最终状态与成功率
    semantics: 按支付方式和渠道比较目标、基线的终态订单、成功订单、截至快照未支付订单和成功率，并保持失败原因、失败阶段、重试及耗时不可推断边界。
    axis_kind: market_context
    target_metric_refs: [paid_amount]
    metric_refs: [terminal_payment_orders, successful_payment_orders, not_paid_payment_orders, payment_success_rate]
    dimension_refs: [payment_method, channel]
    context_source_refs: []
    capability_refs: [payment_outcome_compare]
    reconciliation_group: payment_final_outcome_health
    selection_policy: association_context_when_available
    source_refs:
      - "contracts/sources/payment-final-outcome.source.yaml#status_authority"
      - "contracts/sources/payment-final-outcome.source.yaml#coverage.supported_analyses"
