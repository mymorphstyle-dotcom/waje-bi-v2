    required_metrics: [paid_amount]
    supported_claim_types: [recurring_pattern_existence]
    minimum_readiness: {required_slots: all, accepted_completeness: [complete]}
    degradation_policy: {missing_required_input: block_claim, incomplete_input: degrade_claim}
    supported_evidence_types: [statistical_association]
    maximum_claim_strength: recurring_pattern
  event_window_compare:
    query_families: [event_context_probe]
    required_metrics: []
