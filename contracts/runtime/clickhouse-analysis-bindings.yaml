      payload_kind: cross_source_association
      query_families: {outcome: association_outcome_timeseries, candidate: association_candidate_timeseries}
      fields: {target_key: paid_amount, time_key: observation_key}
      join_keys: [window_id, observation_key]
      candidate_keys: [player_bet_amount, player_bet_count, player_avg_bet_amount, gameplay_users, gameplay_rounds, gameplay_profit, service_fee_rake]
      parameters: {methods: [pearson, spearman], transforms: [level, difference, signed_log_difference], lags: [0], min_samples: 30, rolling_window: 90, min_rolling_windows: 3, stability_direction_ratio: 0.70, min_abs_correlation: 0.10, alpha: 0.05, fdr_method: by}
