    required_capabilities: [user_mix_contribution, high_value_user_contribution]
    condition: components_present
    supported_question_families: [paid_amount_change_explanation, segment_or_factor_attribution]
  factor_topk:
    required_capabilities: [segment_contribution, joint_attribution]
    condition: dimensions_present
    supported_question_families: [paid_amount_change_explanation, segment_or_factor_attribution]
  anomaly:
    required_capabilities: [outlier_scan, outlier_contribution]
    condition: anomaly_review_requested
