contract_version: "15"
artifact: clickhouse_analysis_runtime_bindings
business_timezone: Africa/Lagos
public_scope_types: [full_sample]

exploration_budget_policy:
  schema_version: exploration-budget-policy.v1
  scope: run_attempt
  protected_axis_roles: [required, disclosure]
  auxiliary_budget_limit: null
  accounting_unit: declared_task_unit

restricted_output_policy:
  version: "1"
  contract_ref: contracts/ledger/factor-ledger.yaml#review_limitations.raw_identifier_output_limit
  blocked_raw_fields: [order_id, user_id]

claim_strength_taxonomy:
  version: "1"
  claim_strength_ranks:
    insufficient: 0
    context_only: 0
    observed: 1
    medium: 2
    high: 3
    strong: 4
  maximum_strength_ranks:
    insufficient: 0
    directional: 1
    candidate_driver: 2
    candidate_mechanism: 2
    anomaly_candidate: 2
    recurring_pattern: 3
    quantified_contribution: 3
    trust_boundary: 1
    verifier_only: 0
    reducer_only: 0

claim_publication_policy:
  version: "2"
  minimum_strength_by_claim_kind:
    baseline_stability: directional
    business_object_candidate_impact: candidate_driver
    candidate_mechanism: candidate_mechanism
    comparative_change: directional
    contract_coverage_and_trust_boundary: trust_boundary
    cross_source_statistical_association: candidate_driver
    external_shock_candidate_or_anomaly: anomaly_candidate
    formula_component_contribution: quantified_contribution
    recurring_pattern_existence: directional
    segment_contribution_or_mix_shift: candidate_driver
    source_reconciliation: quantified_contribution
  composite_support_by_claim_kind:
    business_object_candidate_impact:
      policy: all_required_supports_same_authority
      claim_class: candidate_impact
      publication_strength: candidate_driver
      causal_interpretation_allowed: false
      identity_fields: [event_ref, temporal_authority_ref]
      required_supports:
        - {source_claim_kind: business_object_candidate_impact, evidence_kind: observed, maximum_claim_strength: directional, evidence_contract: event-window-metric-comparison.v1}
        - {source_claim_kind: candidate_mechanism, evidence_kind: observed, maximum_claim_strength: candidate_mechanism, evidence_contract: event-presence.v1}

metric_display_policies:
  version: "1"
  allowed:
    - {value_semantics: raw_scalar, display_format: number}
    - {value_semantics: scalar_ratio, display_format: percent}
    - {value_semantics: gameplay_activity_amount, display_format: number}

metric_business_labels:
  version: "1"
  labels:
    player_bet_amount: [玩家下注金额, 下注金额]
    player_bet_count: [玩家下注次数, 下注次数]
    player_avg_bet_amount: [玩家次均下注金额, 次均下注金额]
    gameplay_users: [玩法参与人次, 游戏人次]
    gameplay_rounds: [玩法局数, 游戏局数]
    gameplay_profit: [玩法盈利, 游戏盈利]
    service_fee_rake: [服务费抽水, 抽水金额]
    paid_amount: [付费金额, 收入]
    paid_users: [付费人数, 付费用户数]
    paid_orders: [付费订单数, 支付订单数]
    first_paid_users: [首充人数, 首次付费人数]
    paid_frequency: [付费频次, 付费次数]
    avg_order_amount: [单笔付费金额, 客单价]
    payment_success_rate: [支付成功率]
    active_users: [活跃用户, 日活]
    new_users: [新增用户, 新用户]
    registrations: [注册人数, 注册用户, 注册]
    aggregate_marketing_cost: [投放成本, 营销成本]
    profit: [利润]

datasets:
  paid_order_success:
    intent_roles: [metric_source]
    date_field: business_date_lagos
    schema_contract_ref: contracts/sources/paid-order-detail.source.yaml@0.3#storage_boundary.clean_schema
    requires_release: true
    release_membership: {policy: exact_dataset_set, dataset_ids: [paid_order_success]}
    required_fields: [business_date_lagos]
    customer_safe_filter_fields: [paid_amount_ngn, currency, is_new_user, is_first_payment, channel, payment_method, country, region, city, device_brand, device_model, os, network_type, payment_latency_seconds]
    schema_fields: [order_id, user_id, business_date_lagos, payment_completed_ms, payment_started_ms, paid_amount_ngn, currency, is_new_user, is_first_payment, channel, payment_method, country, region, city, device_brand, device_model, os, network_type, registered_at, first_paid_at, payment_latency_seconds, raw_date]
  payment_attempt:
    intent_roles: [metric_source]
    date_expression: "toDate(toTimeZone(fromUnixTimestamp64Milli(toInt64OrZero(`支付发起时间`)), 'Africa/Lagos'))"
    required_fields: [支付发起时间]
    customer_safe_filter_fields: []
  market_dashboard:
    intent_roles: [metric_source]
    date_field: business_date
    physical_table_prefix: market_dashboard_daily__
    requires_physical_revision: true
    requires_release: true
    release_membership: {policy: exact_dataset_set, dataset_ids: [market_dashboard, market_dashboard_channel]}
    snapshot_field: snapshot_id
    required_fields: [business_date]
    customer_safe_filter_fields: [game]
    schema_fields: [snapshot_id, load_revision, business_date, game, active_users, new_users, revenue, active_user_arpu, registrations, new_devices, login_accounts, registration_rate, zero_round_user_share, gameplay_users, gameplay_rounds, app_avg_online_time, effective_user_app_avg_online_time, historical_paid_active_users, first_paid_amount, new_paid_amount, login_user_avg_recharge, avg_first_paid_amount, first_paid_rate, first_paid_users, new_paid_rate, new_paid_users, paid_users, paid_amount, recharge_channel_fee, withdraw_request_amount, withdraw_arrived_users, withdraw_arrived_amount, withdraw_to_recharge_ratio, withdraw_request_users, withdraw_fee, withdraw_user_fee, aggregate_marketing_cost, profit]
    grain: [snapshot_id, load_revision, business_date, game]
    unique_key: [snapshot_id, load_revision, business_date, game]
  market_dashboard_channel:
    intent_roles: [metric_source]
    date_field: business_date
    physical_table_prefix: market_dashboard_channel_daily__
    requires_physical_revision: true
    requires_release: true
