goal_obligations:
  explain_change:
    business_name: 指标变化原因分析
    semantics: 先验证目标指标相对主基线的真实方向和幅度，再从公式、聚合维度和时间背景定位主要驱动，并明确证据边界。
    question_family_ref: paid_amount_change_explanation
    target_metric_refs: [paid_amount]
    required_outcomes: [direction_and_magnitude, ranked_drivers, quantified_contributions, candidate_explanations, evidence_boundaries]
    outcome_claim_types:
      direction_and_magnitude: [comparative_change]
      ranked_drivers: [formula_component_contribution, segment_contribution_or_mix_shift]
      quantified_contributions: [formula_component_contribution, segment_contribution_or_mix_shift]
      candidate_explanations: [cross_source_statistical_association, candidate_mechanism]
      evidence_boundaries: [contract_coverage_and_trust_boundary]
    completion_policy: {obligation_success: verified_or_explicit_boundary, required_axis_completion: all_required_and_disclosure_axes_terminal, publication_authority: verifier_passed}
    analysis_axes:
      - {axis_id: change_validation, role: required}
      - {axis_id: formula_tree, role: required}
      - {axis_id: payment_outcome_health, role: required}
      - {axis_id: acquisition_funnel, role: auxiliary}
      - {axis_id: dimension_localization, role: auxiliary}
      - {axis_id: time_context, role: auxiliary}
      - {axis_id: cross_source_context, role: auxiliary}
      - {axis_id: market_context, role: auxiliary}
      - {axis_id: external_context_screen, role: auxiliary}
      - {axis_id: internal_operation_context, role: auxiliary}
      - {axis_id: data_quality, role: disclosure}
  pattern_explanation:
    business_name: 重复模式验证与解释
    semantics: 验证重复时间模式的幅度、稳定性与例外，并在证据上限内给出候选机制。
