contract_version: "1"
artifact: clickhouse_analysis_runtime_bindings
business_timezone: Africa/Lagos

claim_strength_taxonomy:
  version: "1"
  claim_strength_ranks:
    insufficient: 0
    context_only: 0
    dry_run_context: 0
    observed: 1
    medium: 2
    high: 3
    strong: 4
  maximum_strength_ranks:
    insufficient: 0
    directional: 1
    candidate_driver: 2
    candidate_mechanism: 2
    anomaly_candidate: 2
    recurring_pattern: 3
    quantified_contribution: 3
    trust_boundary: 1
    verifier_only: 0
    reducer_only: 0

metric_display_policies:
  version: "1"
  allowed:
    - {value_semantics: raw_scalar, display_format: number}
    - {value_semantics: scalar_ratio, display_format: percent}
    - {value_semantics: gameplay_activity_amount, display_format: number}

metric_business_labels:
  version: "1"
  labels:
    player_bet_amount: [玩家下注金额, 下注金额]
    paid_amount: [付费金额, 收入]
    paid_users: [付费人数, 付费用户数]
    paid_orders: [付费订单数, 支付订单数]
    first_paid_users: [首充人数, 首次付费人数]
    paid_frequency: [付费频次, 付费次数]
    avg_order_amount: [单笔付费金额, 客单价]
    payment_success_rate: [支付成功率]
    active_users: [活跃用户, 日活]
    new_users: [新增用户, 新用户]
    registrations: [注册人数, 注册用户, 注册]
    aggregate_marketing_cost: [投放成本, 营销成本]
    profit: [利润]

datasets:
  paid_order_success:
    date_field: business_date_lagos
    schema_contract_ref: contracts/sources/paid-order-detail.source.yaml@0.3#storage_boundary.clean_schema
    requires_release: true
    release_membership: {policy: exact_dataset_set, dataset_ids: [paid_order_success]}
    required_fields: [business_date_lagos]
    schema_fields: [order_id, user_id, business_date_lagos, payment_completed_ms, payment_started_ms, paid_amount_ngn, currency, is_new_user, is_first_payment, channel, payment_method, country, region, city, device_brand, device_model, os, network_type, registered_at, first_paid_at, payment_latency_seconds, raw_date]
  payment_attempt:
    date_expression: "toDate(toTimeZone(fromUnixTimestamp64Milli(toInt64OrZero(`支付发起时间`)), 'Africa/Lagos'))"
    required_fields: [支付发起时间]
  market_dashboard:
    date_field: business_date
    physical_table_prefix: market_dashboard_daily__
    legacy_physical_tables: [market_dashboard_daily]
    requires_physical_revision: true
    requires_release: true
    release_membership: {policy: exact_dataset_set, dataset_ids: [market_dashboard, market_dashboard_channel]}
    snapshot_field: snapshot_id
    required_fields: [business_date]
    schema_fields: [snapshot_id, load_revision, business_date, game, active_users, new_users, revenue, active_user_arpu, registrations, new_devices, login_accounts, registration_rate, zero_round_user_share, gameplay_users, gameplay_rounds, app_avg_online_time, effective_user_app_avg_online_time, historical_paid_active_users, first_paid_amount, new_paid_amount, login_user_avg_recharge, avg_first_paid_amount, first_paid_rate, first_paid_users, new_paid_rate, new_paid_users, paid_users, paid_amount, recharge_channel_fee, withdraw_request_amount, withdraw_arrived_users, withdraw_arrived_amount, withdraw_to_recharge_ratio, withdraw_request_users, withdraw_fee, withdraw_user_fee, aggregate_marketing_cost, profit]
    grain: [snapshot_id, load_revision, business_date, game]
    unique_key: [snapshot_id, load_revision, business_date, game]
  market_dashboard_channel:
    date_field: business_date
    physical_table_prefix: market_dashboard_channel_daily__
    legacy_physical_tables: [market_dashboard_channel_daily]
    requires_physical_revision: true
    requires_release: true
    release_membership: {policy: exact_dataset_set, dataset_ids: [market_dashboard, market_dashboard_channel]}
    snapshot_field: snapshot_id
    required_fields: [business_date]
    schema_fields: [snapshot_id, load_revision, business_date, game, channel, active_users, new_users, revenue, active_user_arpu, registrations, new_devices, login_accounts, registration_rate, zero_round_user_share, gameplay_users, gameplay_rounds, app_avg_online_time, effective_user_app_avg_online_time, historical_paid_active_users, first_paid_amount, new_paid_amount, login_user_avg_recharge, avg_first_paid_amount, first_paid_rate, first_paid_users, new_paid_rate, new_paid_users, paid_users, paid_amount, recharge_channel_fee, withdraw_request_amount, withdraw_arrived_users, withdraw_arrived_amount, withdraw_to_recharge_ratio, withdraw_request_users, withdraw_fee, withdraw_user_fee, aggregate_marketing_cost, profit]
    grain: [snapshot_id, load_revision, business_date, game, channel]
    unique_key: [snapshot_id, load_revision, business_date, game, channel]
  gameplay:
    date_field: business_date
    physical_table_prefix: gameplay_daily__
    legacy_physical_tables: [gameplay_daily]
    requires_physical_revision: true
    requires_release: true
    release_membership: {policy: exact_dataset_set, dataset_ids: [gameplay, gameplay_channel]}
    snapshot_field: snapshot_id
    required_fields: [business_date]
    schema_fields: [snapshot_id, load_revision, business_date, service_scope, gameplay, gameplay_users, gameplay_penetration_rate, gameplay_rounds, rounds_per_user, player_match_rate, total_rounds, service_fee_rake, robot_cash_won, system_rake_rate, gameplay_profit, profit_share, bet_amount_share, player_bet_amount, player_bet_count, betting_users_derived, player_bet_count_per_user, player_avg_bet_amount, player_bet_amount_per_user, robot_cash_lost_raw]
    grain: [snapshot_id, load_revision, business_date, service_scope, gameplay]
    unique_key: [snapshot_id, load_revision, business_date, service_scope, gameplay]
  gameplay_channel:
    date_field: business_date
    physical_table_prefix: gameplay_channel_daily__
    legacy_physical_tables: [gameplay_channel_daily]
    requires_physical_revision: true
    requires_release: true
    release_membership: {policy: exact_dataset_set, dataset_ids: [gameplay, gameplay_channel]}
    snapshot_field: snapshot_id
    required_fields: [business_date, channel]
    schema_fields: [snapshot_id, load_revision, business_date, channel, service_scope, gameplay, gameplay_users, gameplay_penetration_rate, gameplay_rounds, rounds_per_user, player_match_rate, total_rounds, service_fee_rake, robot_cash_won, system_rake_rate, gameplay_profit, profit_share, bet_amount_share, player_bet_amount, player_bet_count, betting_users_derived, player_bet_count_per_user, player_avg_bet_amount, player_bet_amount_per_user, robot_cash_lost_raw]
    grain: [snapshot_id, load_revision, business_date, channel, service_scope, gameplay]
    unique_key: [snapshot_id, load_revision, business_date, channel, service_scope, gameplay]
  external_event:
    date_field: event_start_date
    physical_table_prefix: business_events__
    legacy_physical_tables: [business_events]
    requires_physical_revision: true
    requires_release: true
    release_membership: {policy: exact_dataset_set, dataset_ids: [external_event]}
    snapshot_field: snapshot_id
    required_fields: [event_start_date]
    schema_fields: [snapshot_id, load_revision, source_family, event_id, event_type, event_start_date, event_end_date, affected_scope, authority, evidence_level, wording_limit, recurrence_kind, recurrence_month_start, recurrence_day_start, recurrence_month_end, recurrence_day_end, payload]
    grain: [snapshot_id, load_revision, source_family, event_id]
    unique_key: [snapshot_id, load_revision, source_family, event_id]
  internal_operation_event:
    date_field: event_start_date
    physical_table_prefix: business_events__
    legacy_physical_tables: [business_events]
    requires_physical_revision: true
    requires_release: true
    release_membership: {policy: exact_dataset_set, dataset_ids: [internal_operation_event]}
    snapshot_field: snapshot_id
    required_fields: [event_start_date]
    schema_fields: [snapshot_id, load_revision, source_family, event_id, event_type, event_start_date, event_end_date, affected_scope, authority, evidence_level, wording_limit, recurrence_kind, recurrence_month_start, recurrence_day_start, recurrence_month_end, recurrence_day_end, payload]
    grain: [snapshot_id, load_revision, source_family, event_id]
    unique_key: [snapshot_id, load_revision, source_family, event_id]
    availability_policy: released_snapshot_required

metrics:
  player_bet_amount:
    contract_ref: contracts/sources/gameplay.source.yaml@0.1#field_contracts.player_bet_amount
    dataset_id: gameplay
    expression: sum(player_bet_amount)
    aggregation: sum
    required_fields: [player_bet_amount]
    grain: [window_id]
    value_semantics: gameplay_activity_amount
    display_format: number
    reconciliation_tolerance: 0.000000000001
    reconciliation_strategy: additive_sum
    claim_types: [candidate_mechanism, comparative_change]
    maximum_claim_strength: observed
    source_adapters:
      gameplay_channel:
        contract_ref: contracts/sources/gameplay.source.yaml@0.1#field_contracts.player_bet_amount
        expression: sum(player_bet_amount)
        aggregation: sum
        required_fields: [player_bet_amount]
        grain: [window_id]
        value_semantics: gameplay_activity_amount
        display_format: number
        reconciliation_tolerance: 0.000000000001
        reconciliation_strategy: additive_sum
        claim_types: [candidate_mechanism, comparative_change]
        maximum_claim_strength: observed
  paid_amount:
    contract_ref: contracts/metrics/paid-amount.metric.yaml@0.1
    dataset_id: paid_order_success
    expression: sum(paid_amount_ngn)
    aggregation: sum
    required_fields: [paid_amount_ngn]
    grain: [window_id]
    value_semantics: raw_scalar
    display_format: number
    reconciliation_tolerance: 0.01
    reconciliation_strategy: additive_sum
    claim_types: [comparative_change, formula_component_contribution, segment_contribution_or_mix_shift]
    source_adapters:
      market_dashboard:
        contract_ref: contracts/sources/market-dashboard.source.yaml@0.1#field_contracts.paid_amount
        expression: sum(paid_amount)
        aggregation: sum
        required_fields: [paid_amount]
        grain: [window_id]
        claim_types: [comparative_change, source_reconciliation]
        reconciliation_tolerance: 0.01
        reconciliation_strategy: additive_sum
        value_semantics: raw_scalar
        display_format: number
        maximum_claim_strength: observed
      market_dashboard_channel:
        contract_ref: contracts/sources/market-dashboard.source.yaml@0.1#field_contracts.paid_amount
        expression: sum(paid_amount)
        aggregation: sum
        required_fields: [paid_amount]
        grain: [window_id]
        claim_types: [comparative_change, source_reconciliation]
        reconciliation_tolerance: 0.01
        reconciliation_strategy: additive_sum
        value_semantics: raw_scalar
        display_format: number
        maximum_claim_strength: observed
  paid_users:
    contract_ref: contracts/backlog/missing-contracts.yaml#component_contracts
    dataset_id: paid_order_success
    expression: uniqExact(user_id)
    aggregation: distinct_count
    required_fields: [user_id]
    grain: [window_id]
    value_semantics: raw_scalar
    display_format: number
    reconciliation_strategy: unsupported_non_additive
    source_adapters:
      market_dashboard:
        contract_ref: contracts/sources/market-dashboard.source.yaml@0.1#field_contracts.paid_users
        expression: sum(paid_users)
        aggregation: sum
        required_fields: [paid_users]
        grain: [window_id]
        claim_types: [comparative_change]
        reconciliation_tolerance: 0.0
        reconciliation_strategy: exact_additive_count
        value_semantics: raw_scalar
        display_format: number
  paid_orders:
    contract_ref: contracts/sources/paid-order-detail.source.yaml@0.2
    dataset_id: paid_order_success
    expression: uniqExact(order_id)
    aggregation: distinct_count
    required_fields: [order_id]
    grain: [window_id]
    value_semantics: raw_scalar
    display_format: number
    reconciliation_strategy: exact_additive_count
  first_paid_users:
    contract_ref: contracts/backlog/missing-contracts.yaml#component_contracts
    dataset_id: paid_order_success
    expression: "uniqExactIf(user_id, is_first_payment = '1')"
    aggregation: distinct_count_if
    required_fields: [user_id, is_first_payment]
    grain: [window_id]
    value_semantics: raw_scalar
    display_format: number
    reconciliation_strategy: unsupported_non_additive
    source_adapters:
      market_dashboard:
        contract_ref: contracts/sources/market-dashboard.source.yaml@0.1#field_contracts.first_paid_users
        expression: sum(first_paid_users)
        aggregation: sum
        required_fields: [first_paid_users]
        grain: [window_id]
        claim_types: [comparative_change]
        reconciliation_tolerance: 0.0
        reconciliation_strategy: exact_additive_count
        value_semantics: raw_scalar
        display_format: number
  paid_frequency:
    contract_ref: contracts/backlog/missing-contracts.yaml#component_contracts
    dataset_id: paid_order_success
    expression: "uniqExact(order_id) / nullIf(uniqExact(user_id), 0)"
    aggregation: ratio
    required_fields: [order_id, user_id]
    grain: [window_id]
    value_semantics: raw_scalar
    display_format: number
    numerator_metric: paid_orders
    denominator_metric: paid_users
    reconciliation_strategy: ratio_from_components
  avg_order_amount:
    contract_ref: contracts/backlog/missing-contracts.yaml#component_contracts
    dataset_id: paid_order_success
    expression: "sum(paid_amount_ngn) / nullIf(uniqExact(order_id), 0)"
    aggregation: ratio
    required_fields: [paid_amount_ngn, order_id]
    grain: [window_id]
    value_semantics: raw_scalar
    display_format: number
    numerator_metric: paid_amount
    denominator_metric: paid_orders
    reconciliation_strategy: ratio_from_components
  payment_success_rate:
    contract_ref: contracts/backlog/missing-contracts.yaml#payment_status_and_dedup_contract
    dataset_id: payment_attempt
    expression: "uniqExactIf(`订单id`, `支付状态` = 'pay_success') / nullIf(uniqExact(`订单id`), 0)"
    aggregation: ratio
    required_fields: [订单id, 支付状态, 支付发起时间]
    grain: [window_id]
    value_semantics: scalar_ratio
    display_format: percent
    reconciliation_strategy: unsupported_non_additive
  active_users:
    contract_ref: contracts/sources/market-dashboard.source.yaml@0.1#field_contracts.active_users
    dataset_id: market_dashboard
    expression: sum(active_users)
    aggregation: sum
    required_fields: [active_users]
    grain: [window_id]
    claim_types: [comparative_change, source_reconciliation]
    reconciliation_tolerance: 0.0
    reconciliation_strategy: exact_additive_count
    value_semantics: raw_scalar
    display_format: number
  new_users:
    contract_ref: contracts/sources/market-dashboard.source.yaml@0.1#field_contracts.new_users
    dataset_id: market_dashboard
    expression: sum(new_users)
    aggregation: sum
    required_fields: [new_users]
    grain: [window_id]
    claim_types: [comparative_change, source_reconciliation]
    reconciliation_tolerance: 0.0
    reconciliation_strategy: exact_additive_count
    value_semantics: raw_scalar
    display_format: number
  registrations:
    contract_ref: contracts/sources/market-dashboard.source.yaml@0.1#field_contracts.registrations
    dataset_id: market_dashboard
    expression: sum(registrations)
    aggregation: sum
    required_fields: [registrations]
    grain: [window_id]
    claim_types: [comparative_change, source_reconciliation]
    reconciliation_tolerance: 0.0
    reconciliation_strategy: exact_additive_count
    value_semantics: raw_scalar
    display_format: number
  aggregate_marketing_cost:
    contract_ref: contracts/sources/market-dashboard.source.yaml@0.1#field_contracts.aggregate_marketing_cost
    dataset_id: market_dashboard
    expression: sum(aggregate_marketing_cost)
    aggregation: sum
    required_fields: [aggregate_marketing_cost]
    grain: [window_id]
    claim_types: [comparative_change, source_reconciliation]
    reconciliation_tolerance: 0.01
    reconciliation_strategy: additive_sum
    value_semantics: raw_scalar
    display_format: number
  profit:
    contract_ref: contracts/sources/market-dashboard.source.yaml@0.1#field_contracts.profit
    dataset_id: market_dashboard
    expression: sum(profit)
    aggregation: sum
    required_fields: [profit]
    grain: [window_id]
    claim_types: [comparative_change, source_reconciliation]
    reconciliation_tolerance: 0.01
    reconciliation_strategy: additive_sum
    value_semantics: raw_scalar
    display_format: number

dimensions:
  gameplay:
    contract_ref: contracts/sources/gameplay.source.yaml@0.1#field_contracts.gameplay
    dataset_id: gameplay
    source_field: gameplay
    allowed_grains: [day, window_id]
    allowed_query_families: [gameplay_activity_probe]
    source_adapters:
      gameplay_channel:
        contract_ref: contracts/sources/gameplay.source.yaml@0.1#field_contracts.gameplay
        source_field: gameplay
        allowed_grains: [day, window_id]
        allowed_query_families: [gameplay_activity_probe]
  channel:
    contract_ref: contracts/dimensions/dimensions.yaml#channel
    dataset_id: paid_order_success
    source_field: channel
    allowed_grains: [day, window_id]
    source_adapters:
      market_dashboard_channel:
        contract_ref: contracts/sources/market-dashboard.source.yaml@0.1#runtime_binding.channel
        source_field: channel
        allowed_grains: [day, window_id]
        null_bucket: Unknown
        permission_scope: analyst
  payment_method: {contract_ref: contracts/dimensions/dimensions.yaml#payment_method, dataset_id: paid_order_success, source_field: payment_method, allowed_grains: [day, window_id]}
  region: {contract_ref: contracts/dimensions/dimensions.yaml#region, dataset_id: paid_order_success, source_field: region, allowed_grains: [day, window_id]}
  device_brand: {contract_ref: contracts/dimensions/dimensions.yaml#device_brand, dataset_id: paid_order_success, source_field: device_brand, allowed_grains: [day, window_id]}

query_shapes:
  daily_metric_baselines: {required_fields: [window_id, window_role, observation_key], unique_key: [window_id, observation_key], grain: [window_id, observation_key], dimension_presence_policy: paired_required, source_field_policy: metric_bindings, window_policy: fixed_resolved_windows, reconciliation: overall_channel_when_paired, provider_bounds: throw_on_overflow}
  component_driver_scan: {required_fields: [window_id, window_role, observation_key], unique_key: [window_id, observation_key], grain: [window_id, observation_key], dimension_presence_policy: paired_required}
  payment_success_scan: {required_fields: [window_id, window_role, observation_key], unique_key: [window_id, observation_key], grain: [window_id, observation_key], dimension_presence_policy: paired_required}
  dimension_contribution_scan: {required_fields: [window_id, window_role, observation_key], unique_key: [window_id, observation_key], grain: [window_id, observation_key], dimension_topology: independent, dimension_presence_policy: paired_required}
  joint_candidate_scan: {required_fields: [window_id, window_role, observation_key], unique_key: [window_id, observation_key], grain: [window_id, observation_key], dimension_topology: joint, dimension_presence_policy: paired_required}
  time_bucket_scan: {required_fields: [window_id, window_role, observation_key, calendar_week, weekday, month_phase], unique_key: [window_id, observation_key], grain: [window_id, observation_key], dimension_presence_policy: paired_required}
  data_quality_probe: {required_fields: [window_id, window_role, observation_key, source_row_count], unique_key: [window_id, observation_key], grain: [window_id, observation_key], dimension_presence_policy: paired_required, source_field_policy: metric_bindings, window_policy: fixed_resolved_windows, reconciliation: overall_channel_when_paired, provider_bounds: throw_on_overflow}
  event_context_probe:
    required_fields: [window_id, window_role, observation_key, event_count, source_family, event_id, event_type, event_start_date, event_end_date, affected_scope, authority, evidence_level, wording_limit, recurrence_kind, recurrence_month_start, recurrence_day_start, recurrence_month_end, recurrence_day_end, payload]
    source_fields: [source_family, event_id, event_type, event_start_date, event_end_date, affected_scope, authority, evidence_level, wording_limit, recurrence_kind, recurrence_month_start, recurrence_day_start, recurrence_month_end, recurrence_day_end, payload]
    unique_key: [window_id, event_id]
    grain: [window_id, event_id]
    result_semantics: complete_context_rows
    max_context_rows: 5000
    dimension_presence_policy: sparse_allowed
    window_policy: fixed_resolved_windows
    reconciliation: not_applicable
    provider_bounds: {max_context_rows: 5000, overflow: detect_extra_row}
  gameplay_activity_probe: {required_fields: [window_id, window_role, observation_key], unique_key: [window_id, observation_key], grain: [window_id, observation_key], dimension_presence_policy: sparse_allowed, source_field_policy: metric_bindings, window_policy: fixed_resolved_windows, reconciliation: overall_channel_when_paired, provider_bounds: throw_on_overflow}
  channel_context_probe: {required_fields: [window_id, window_role, observation_key], unique_key: [window_id, observation_key, channel], grain: [window_id, observation_key, channel], dimension_topology: joint, dimension_presence_policy: paired_required, source_fields: [channel], source_field_policy: metric_bindings, window_policy: fixed_resolved_windows, reconciliation: overall_channel_required, provider_bounds: throw_on_overflow}
  source_reconciliation_probe: {required_fields: [window_id, window_role, observation_key], unique_key: [window_id, observation_key], grain: [window_id, observation_key], dimension_presence_policy: paired_required}
  high_value_scan:
    required_fields: [window_id, window_role, observation_key, high_value_threshold, high_value_amount, high_value_paid_users]
    unique_key: [window_id, observation_key]
    grain: [window_id, observation_key]
    dimension_presence_policy: paired_required
    query_parameters:
      threshold_quantile: 0.95
      threshold_reference: within_window_user_paid_amount
      aggregation_grain: [window_id, observation_key, user_id]
    join_expectation:
      cardinality: many_to_one
      audit_fields: [__join_input_rows, __join_output_rows, __join_duplicate_keys, __join_unmatched_rows]
      max_duplicate_keys: 0
      max_unmatched_rows: 0

question_family_obligations:
  pattern_explanation:
    required_capabilities: [data_quality_profile, metric_timeseries, evidence_reduce, answer_verify]
    conditional_rules:
      - {condition: baselines_present, add: [compare_periods]}
      - {condition: multiple_dimensions_present, add: [candidate_dimension_screen]}
      - {condition: event_context_requested, add: [event_window_compare]}
    independent_capabilities: [compare_period_phases, weekday_calendar_compare]
    minimum_publishable_evidence: [verified_observation, verified_trust_boundary]
    missing_contract_owner: analysis_contract_owner
    degradation_policy: {missing_required_input: explicit_gap, missing_optional_input: omit_with_reason}
  paid_amount_change_explanation:
    required_capabilities: [data_quality_profile, driver_decomposition, answer_verify]
    conditional_rules:
      - {condition: baselines_present, add: [compare_periods]}
      - {condition: dimensions_present, add: [segment_contribution]}
      - {condition: multiple_dimensions_present, add: [joint_attribution]}
      - {condition: components_present, add: [component_contribution]}
    independent_capabilities: [metric_timeseries]
    minimum_publishable_evidence: [verified_observation, verified_trust_boundary]
    missing_contract_owner: analysis_contract_owner
    degradation_policy: {missing_required_input: explicit_gap, missing_optional_input: omit_with_reason}
  business_object_impact_review:
    required_capabilities: [data_quality_profile]
    conditional_rules:
      - {condition: baselines_present, add: [compare_periods]}
      - {condition: event_context_requested, add: [event_evidence]}
    independent_capabilities: [gameplay_activity_context, event_window_compare]
    minimum_publishable_evidence: [verified_observation, verified_trust_boundary]
    missing_contract_owner: analysis_contract_owner
    degradation_policy: {missing_required_input: explicit_gap, missing_optional_input: omit_with_reason}
  revenue_health_review:
    required_capabilities: [data_quality_profile, formula_decompose]
    conditional_rules:
