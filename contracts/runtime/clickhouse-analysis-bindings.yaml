      - "contracts/metrics/paid-amount.metric.yaml#paid_amount"
  business_context:
    business_name: 业务事件背景
    semantics: 当用户明确询问业务事件或前序证据触发时，检查活动、运营和外部事件的候选解释。
    axis_kind: business_context
    target_metric_refs: [paid_amount]
    metric_refs: []
    dimension_refs: []
    context_source_refs: [external_event, internal_operation_event]
    capability_refs: [event_evidence, event_window_compare]
    reconciliation_group: paid_amount_business_context
    selection_policy: user_or_evidence_triggered
    source_refs:
      - "contracts/ssot/付费金额影响因子分析.mm#内外部因素"
      - "contracts/events/events.yaml#events"
  data_quality:
    business_name: 数据质量与证据边界
    semantics: 检查目标指标、时间窗口和查询结果的完整性，并约束最终答案可发布的结论强度。
    axis_kind: data_quality
    target_metric_refs: [paid_amount]
    metric_refs: []
    dimension_refs: []
    context_source_refs: []
    capability_refs: [data_quality_profile]
    reconciliation_group: paid_amount_data_quality
    selection_policy: always
    source_refs:
      - "contracts/metrics/paid-amount.metric.yaml#paid_amount"
      - "contracts/ledger/factor-ledger.yaml#factor_groups.paid_amount_metric_source"
  evidence_synthesis:
    business_name: 证据集合收敛
    semantics: 在发布前对已验证证据做可重放的归并与边界收敛，不生成新的业务事实。
    axis_kind: data_quality
    target_metric_refs: [paid_amount]
    metric_refs: []
    dimension_refs: []
    context_source_refs: []
    capability_refs: [evidence_reduce]
    reconciliation_group: paid_amount_evidence_synthesis
