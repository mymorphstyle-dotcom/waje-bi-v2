contract_version: "0.1"
capability_id: driver_decomposition
business_name: Driver decomposition
review_status: draft

responsibilities:
  - Decompose paid amount movement between a baseline window and a target window.
  - Quantify whether volume or unit value contributed more to the observed movement.
  - Return accounting contribution evidence without promoting it into causal proof.

parameters:
  required:
    - metric
    - scope
    - time_range
    - baseline
    - target
    - period_key
    - group_key
  optional:
    - volume_key
    - target_group
    - baseline_group

non_uses:
  - Does not prove why users or unit value changed.
  - Does not use raw identifiers in visible output.
  - Does not replace event, segment, or causal evidence checks.

evidence_outputs:
  typed_payload: driver_decomposition_result
  claim_numeric_fields:
    paid_users_contribution:
      value_semantics: target_metric_scalar
      display_format: number
      derivation: multiplicative_shapley_v1
    paid_users_contribution_share:
      value_semantics: signed_unbounded_ratio
      display_format: percent
      derivation: multiplicative_shapley_v1
    paid_frequency_contribution:
      value_semantics: target_metric_scalar
      display_format: number
      derivation: multiplicative_shapley_v1
    paid_frequency_contribution_share:
      value_semantics: signed_unbounded_ratio
      display_format: percent
      derivation: multiplicative_shapley_v1
    avg_order_amount_contribution:
      value_semantics: target_metric_scalar
      display_format: number
      derivation: multiplicative_shapley_v1
    avg_order_amount_contribution_share:
      value_semantics: signed_unbounded_ratio
      display_format: percent
      derivation: multiplicative_shapley_v1
    formula_contribution_total:
      value_semantics: target_metric_scalar
      display_format: number
      derivation: multiplicative_shapley_v1
  envelope_fields:
    - evidence_type
    - strength
    - wording_limit
    - scope
    - metric
    - limitations
  payload_fields:
    - decompositions
    - primary_driver
    - volume_share
    - unit_value_share
    - amount_delta_ratio
    - primary_core_driver
    - core_driver_ranking
    - core_factor_contributions
    - core_factor_effect_total
    - core_reconciliation_residual
    - core_reconciliation_status
    - payment_success_assumption
    - paid_users_baseline_value
    - paid_users_target_value
    - paid_users_delta
    - paid_users_delta_ratio
    - paid_users_contribution
    - paid_users_contribution_share
    - paid_frequency_baseline_value
    - paid_frequency_target_value
    - paid_frequency_delta
    - paid_frequency_delta_ratio
    - paid_frequency_contribution
    - paid_frequency_contribution_share
    - avg_order_amount_baseline_value
    - avg_order_amount_target_value
    - avg_order_amount_delta
    - avg_order_amount_delta_ratio
    - avg_order_amount_contribution
    - avg_order_amount_contribution_share

limitations:
  - Accounting contribution can support contribution wording, not causal wording.
  - Missing volume fields degrade the analysis.
  - Single-window comparisons cannot prove long-term stability.

degradation_rules:
  - when: no_comparable_segments
    output: insufficient contribution wording.
  - when: missing_volume_field
    output: degrade to amount-only comparison or ask for a supported metric.

lint_rules:
  - rule_id: contribution_wording_only
    severity: degrade
    check: Driver decomposition cannot publish causal wording by itself.

verifier_hooks:
  - contribution_claim_must_state_baseline_and_target
  - causal_wording_requires_external_evidence

typical_question_families:
  - segment_or_factor_attribution
  - paid_amount_change_explanation
  - custom_baseline_comparison
