contract_version: "0.1"
capability_id: answer_verify
business_name: Answer verifier
review_status: draft

responsibilities:
  - Verify final claim groups against evidence refs, contract states, scope, baseline, permission, and wording limits.
  - Block, degrade, or request repair when answer text exceeds supported evidence.
  - Produce verifier status for Answer Package and launch eval.

parameters:
  required:
    - claim_groups
    - evidence_refs
    - contract_versions
    - accepted_graph
    - disabled_or_degraded_paths
  optional:
    - visualization_plan
    - permission_context
    - eval_expectations
    - wording_policy

non_uses:
  - Does not generate new analytical evidence.
  - Does not approve claims without evidence refs.
  - Does not rewrite business contracts, permissions, or ledger states.

evidence_outputs:
  typed_payload: answer_verify_result
  envelope_fields:
    - evidence_type
    - strength
    - wording_limit
    - scope
    - contract_versions
    - limitations
  payload_fields:
    - verified_claims
    - blocked_claims
    - degraded_claims
    - missing_evidence_refs
    - wording_violations
    - visualization_issues
    - required_repairs

limitations:
  - Verifier can only enforce boundaries present in contracts, ledgers, capability outputs, and accepted graph.
  - If evidence refs are missing, claims are blocked or sent to targeted repair.
  - Runtime guardrail promotion from failures requires human review outside this card.

degradation_rules:
  - when: claim_exceeds_wording_limit
    output: downgrade claim or request answer repair.
  - when: evidence_ref_missing
    output: block claim group.
  - when: disabled_path_hidden
    output: require limitation in Answer Package.
  - when: visualization_overstates_evidence
    output: repair visualization plan or block chart.

lint_rules:
  - rule_id: evidence_ref_required
    severity: block
    check: Every claim group must bind to evidence refs.
  - rule_id: wording_limit_enforced
    severity: block
    check: Claim wording cannot exceed allowed wording limit.
  - rule_id: degraded_paths_visible
    severity: targeted_repair
    check: Disabled, degraded, skipped, or blocked paths must be visible when material.

verifier_hooks:
  - final_claim_number_scope_baseline_check
  - missing_contract_wording_check
  - candidate_mechanism_causality_check
  - permission_filtered_artifact_check

typical_question_families:
  - paid_amount_change_explanation
  - pattern_explanation
  - business_object_impact_review
  - revenue_health_review
  - segment_or_factor_attribution
  - anomaly_or_black_swan_review
  - custom_baseline_comparison
  - data_quality_or_evidence_review
