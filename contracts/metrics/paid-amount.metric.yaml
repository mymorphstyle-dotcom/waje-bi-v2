decomposition_paths:
  - path_id: paid_dau_arpu
    ssot_node_id: e01560709518ecd63e8d093985541075
    expression: paid_amount = paid_dau * paid_dau_arpu
    evidence_type: accounting_contribution
    requires_components:
      - paid_dau
      - paid_dau_arpu
    reconciliation:
      required: true
      residual_policy: must_report
    launch_status: available_for_current_paid_order_snapshot
  - path_id: paid_user_arppu
    ssot_node_id: 2ba635b7fc42ce997a777af0aef22d9f
    expression: paid_amount = paid_dau * paid_user_conversion_rate * paid_amount_per_paid_user
    evidence_type: accounting_contribution
    requires_components:
      - paid_dau
      - paid_user_conversion_rate
      - paid_amount_per_paid_user
    reconciliation:
      required: true
      residual_policy: must_report
    launch_status: evidence_linked_dashboard_daily_only
    launch_note: Uses market dashboard 付费日活 and 付费人数 components; paid-order detail remains the joint-analysis source.
  - path_id: new_user_funnel_dashboard
    ssot_node_id: 882c4c534d4d165796562109beb068da
    expression: dashboard_funnel_components = new_users, registrations, registration_rate_new_base, first_pay_users, first_pay_rate_new_base, same_day_new_paid_users, same_day_new_paid_rate
    evidence_type: accounting_contribution
    requires_components:
      - new_users
      - registrations
      - registration_rate_new_base
      - first_pay_users
      - first_pay_rate_new_base
      - same_day_new_paid_users
      - same_day_new_paid_rate
    reconciliation:
      required: true
      residual_policy: must_report
    launch_status: evidence_linked_dashboard_daily_only
    launch_note: Use market dashboard source fields 注册率, 首充率, and 新增付费率 as the v2 business metrics confirmed by owner.
  - path_id: frequency_ticket_size
    ssot_node_id: 9b7c5bb205584cffddef346dfc54c38b
    expression: paid_amount = paid_dau * paid_user_conversion_rate * payment_frequency_per_paid_user * avg_paid_amount_per_payment
    evidence_type: accounting_contribution
    requires_components:
      - paid_dau
      - paid_user_conversion_rate
      - payment_frequency_per_paid_user
      - avg_paid_amount_per_payment
    reconciliation:
      required: true
      residual_policy: must_report
    launch_status: available_with_paid_user_count_expression_for_current_paid_order_snapshot
    accepted_runtime_expression: paid_amount = paid_user_count * payment_frequency_per_paid_user * avg_paid_amount_per_payment
  - path_id: region_sum
    ssot_node_id: 34d9c39ebe6b3c9e5a4034411a58e4d6
    expression: paid_amount = sum(paid_amount by region)
    evidence_type: accounting_contribution
    requires_dimensions:
      - region
    reconciliation:
      required: true
      residual_policy: must_report
    launch_status: needs_dimension_contract
  - path_id: device_sum
    ssot_node_id: 21be18da5198d1d5d012873a1fcf4808
    expression: paid_amount = sum(paid_amount by device_model)
    evidence_type: accounting_contribution
    requires_dimensions:
      - device_model
    reconciliation:
      required: true
      residual_policy: must_report
    launch_status: needs_dimension_contract

claim_boundaries:
  allowed_evidence_types:
    - accounting_contribution
    - statistical_association
    - candidate_mechanism
    - insufficient
  disallowed_without_extra_contracts:
    - causal_evidence
  default_wording_limits:
    accounting_contribution: quantified
    statistical_association: stable_pattern
    candidate_mechanism: candidate
    insufficient: insufficient

quality_guards:
  - guard_id: cumulative_value_guard
    description: Block or downgrade analyses that compare cumulative month-to-date paid amount as if it were daily paid amount.
    severity: block_strong_claim
  - guard_id: formula_reconciliation_guard
    description: Every formula path must report residual and component coverage before quantified wording.
    severity: block_strong_claim
  - guard_id: time_boundary_guard
    description: Analysis windows must record timezone, date inclusivity, and month length handling.
    severity: targeted_repair
  - guard_id: current_data_snapshot_guard
    description: Each analysis uses the currently available data at run time and must preserve historical answer artifacts when later data updates arrive.
    severity: targeted_repair
  - guard_id: materiality_guard
    description: Pattern, anomaly, health, and driver wording must use reviewed business materiality thresholds. Below-reportable changes stay background only; material-driver and strong-anomaly wording require their respective thresholds.
    severity: degrade_or_block
  - guard_id: payment_status_dedup_guard
    description: paid_amount must use final successful payment records and one successful record per order ID; failed, pending, processing, and retry-only records stay in payment-quality analysis.
    severity: block_strong_claim
  - guard_id: grain_guard
    description: Segment or event claims must stay within the grain supported by metric and dimension contracts.
    severity: degrade_or_block

known_gaps:
  - gap_id: physical_source_binding
    description: Current 2026-01-01 through 2026-06-30 paid_order_detail source binding is accepted and loaded into the dev Postgres contract mirror; production runtime schema expansion remains later-phase work.
    data_contract_state: contract_backed
    expected_owner: data_owner
  - gap_id: currency_policy
    description: Current runtime raw amount data is provided in NGN; cross-currency conversion, exchange-rate source, conversion timing, and original-currency validation are deferred to a later contract review.
    data_contract_state: out_of_scope_for_now
    expected_owner: data_owner
  - gap_id: refund_or_reversal_policy
    description: Business basis is accepted as gross successful paid amount; refund, chargeback, cancellation, and reversal source contracts are still needed only for net revenue, adjusted revenue, or adjustment-risk claims.
    data_contract_state: missing_contract
    expected_owner: data_owner
  - gap_id: timezone_policy
    description: Business timezone is accepted as Africa/Lagos with local day boundary [00:00, 24:00); source timestamp mapping and date-field validation still need data contract review.
    data_contract_state: missing_contract
    expected_owner: data_owner
  - gap_id: payment_status_and_dedup_contract
    description: Business boundary and current source status/dedup profile are accepted for paid_amount; broader payment-quality contracts still need runtime implementation detail.
    data_contract_state: missing_contract
    expected_owner: data_owner
  - gap_id: component_contracts
    description: Formula components need metric or dimension contracts before decomposition can produce quantified launch claims.
    data_contract_state: missing_contract
    expected_owner: data_owner
  - gap_id: materiality_policy
    description: Initial grain-aware materiality thresholds and runtime claim-strength gates are accepted for the 2026 H1 paid_order_success_clean profile; future tuning should create a new policy version.
    data_contract_state: contract_backed
    expected_owner: business_owner_and_data_owner_joint_review

review_notes:
  - This contract is source-level and does not define final database tables or SQL.
  - Physical fields, joins, freshness checks, and permission rules are added in later phases.
  - "`formula_decompose` may reference only declared decomposition paths and must report unsupported paths."
