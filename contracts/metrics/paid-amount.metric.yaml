owners:
  business_owner: pending business owner confirmation
  data_owner: pending data owner confirmation

business_meaning: >
  用户在指定业务 scope 和时间窗口内产生的成功付费金额，用于收入变化、
  周期模式、归因、异常、健康度和自定义基准分析。

semantic_boundary:
  amount_basis: successful_paid_amount
  payment_status_and_dedup_policy:
    paid_amount_inclusion: final_successful_paid_orders_only
    final_success_status: pay_success
    non_paid_status: order_success
    amount_field: 支付成功金额
    dedup_key_candidate: 订单id
    dedup_rule: one_latest_pay_success_record_per_order_id
    duplicate_keep_rule: keep_latest_payment_complete_time
    overlap_rule: if_order_success_and_pay_success_share_order_id_ignore_order_success_for_paid_amount
    excluded_from_paid_amount:
      - order_success_without_pay_success
      - duplicate_older_pay_success_records
    quality_analysis_scope: order_success records may support failed or non-paid order analysis after removing order ids that also have pay_success.
    business_decision_status: accepted
    decided_on: "2026-07-05"
    pending_data_contracts:
      - phase_3_runtime_mirror_schema_expansion
  currency_policy:
    analysis_basis: unified_report_currency
    report_currency: NGN
    report_currency_name: Nigerian Naira
    business_decision_status: accepted
    decided_on: "2026-07-05"
    source_amount_currency: NGN
    conversion_source_contract: out_of_scope_for_now
  refund_or_reversal_policy:
    paid_amount_basis: gross_successful_paid_amount
    adjustment_treatment: no_adjustment_proxy_current_phase
    business_decision_status: accepted
    decided_on: "2026-07-05"
    adjustment_source_contract: missing_contract_for_net_revenue_adjustment_risk
  timezone_policy:
    business_timezone: Africa/Lagos
    business_day_boundary: "[00:00, 24:00)"
    date_basis: local_business_day
    business_decision_status: accepted
    decided_on: "2026-07-04"
    source_time_mapping_contract: pending_contract
  data_snapshot_policy:
    analysis_basis: currently_available_data_at_run_time
    historical_artifact_policy: do_not_rewrite_prior_answers_after_data_updates
    update_handling: new_data_requires_new_run_or_new_artifact_version
    answer_requirement: state_data_cutoff_or_current_data_basis_when_available
    business_decision_status: accepted
    decided_on: "2026-07-05"
    accepted_snapshot:
      source_contract: contracts/sources/paid-order-detail.source.yaml
      exported_on: "2026-07-04"
      coverage: complete_2026_january_through_june_dataset
      late_arrivals_or_status_backfill: none_recorded_for_this_snapshot
  materiality_policy:
    decision_status: accepted_initial_policy
    decided_on: "2026-07-05"
    source_profile: paid_order_success_clean_2026_h1
    rule: Use the threshold for the user's query grain and comparison mode; if comparable windows are sparse, degrade to descriptive wording.
    runtime_usage:
      below_reportable_movement: low_priority_background_only_not_main_conclusion_driver_or_anomaly
      reportable_movement: visible_change_allowed
      material_driver: eligible_for_primary_explanation_candidate_set
      strong_anomaly: required_for_strong_anomaly_wording
      llm_override: forbidden_clarify_degrade_or_follow_up_only
    thresholds:
      - grain: hourly_same_lagos_hour
        reportable_movement: ">=2M NGN or >=15%"
        material_driver: ">=3M NGN or >=23%"
        strong_anomaly: ">=4M NGN or >=30%"
      - grain: daily
        reportable_movement: ">=10M NGN or >=3%"
        material_driver: ">=20M NGN or >=7%"
        strong_anomaly: ">=30M NGN or >=10%"
      - grain: three_day_rolling
        reportable_movement: ">=45M NGN or >=5%"
        material_driver: ">=65M NGN or >=7.5%"
        strong_anomaly: ">=80M NGN or >=9%"
      - grain: seven_day_rolling_or_week
        reportable_movement: ">=100M NGN or >=5%"
        material_driver: ">=150M NGN or >=8%"
        strong_anomaly: ">=180M NGN or >=10%"
      - grain: fourteen_day_rolling
        reportable_movement: ">=225M NGN or >=6%"
        material_driver: ">=340M NGN or >=9.5%"
        strong_anomaly: ">=400M NGN or >=11%"
      - grain: thirty_day_rolling_or_month_proxy
        reportable_movement: ">=750M NGN or >=9%"
        material_driver: ">=1.05B NGN or >=14%"
        strong_anomaly: ">=1.20B NGN or >=16%"
      - grain: calendar_month
        reportable_movement: use_30_day_proxy_and_mark_low_confidence
        material_driver: use_30_day_proxy_and_mark_low_confidence
        strong_anomaly: avoid_until_more_months_exist
      - grain: quarter
        reportable_movement: descriptive_only
        material_driver: descriptive_only
        strong_anomaly: no_threshold_from_current_data
  formula_component_policy:
    paid_dau_definition:
      business_definition: 付费日活 means market dashboard 日活历史付费人数; paid success users use 付费人数.
      decided_on: "2026-07-05"
      accepted_source_fields:
        - market_dashboard_2024_2026.日活历史付费人数
    formula_review_note: The SSOT term 当日付费转化率=付费人数/付费日活 is valid when 付费日活 maps to market dashboard 日活历史付费人数.
    new_user_funnel_definition:
      decided_on: "2026-07-05"
      denominator: market_dashboard_2024_2026.新增
      registration_rate: 注册人数 / 新增
      first_pay_rate: 首充人数 / 新增
      same_day_new_paid_rate: 新增付费人数 / 新增
      source_rate_field_policy: Source fields 注册率, 首充率, and 新增付费率 are the v2 business metrics.
  time_semantics:
    logical_event_time: payment_complete_time_lagos_business_date
    supported_window_types:
      - day
      - month
      - month_phase
      - custom_window
      - event_window
    guardrails:
      - Month-phase analysis must use non-cumulative daily paid amount.
      - Month-to-date cumulative values must be identified and blocked for intra-month shape comparison.
      - Calendar windows must record timezone and inclusive/exclusive boundaries before execution.
  supported_grains:
    - full_sample
    - day
    - month
    - month_phase
    - event_window
    - segment_when_dimension_contract_exists
  baseline_compatibility:
    - prior_period
    - same_period_last_year
    - same_month_phase
    - event_relative_window
    - custom_control_window

supported_business_questions:
  - paid_amount_change_explanation
  - pattern_explanation
  - business_object_impact_review
  - revenue_health_review
  - segment_or_factor_attribution
  - anomaly_or_black_swan_review
  - custom_baseline_comparison
  - data_quality_or_evidence_review

