version: "0.1"
source_case_files:
  - evals/phase4/full_period_pattern_cases.yaml
  - evals/phase5/live_node_system_cases.yaml
artifact_policy: real_clickhouse_real_llm_node_debug_only
cases:
  - case_id: phase6_pattern_month_start_negative
    source_case_id: full_month_start_vs_mid_end
    primary_question_family: pattern_explanation
    secondary_question_families: []
    question: "全量样本下，月初1-10号付费金额是否持续高于月中和月末？"
    review_focus: "数据充分但假设不被支持时，输出负向业务答案。"
    required_capabilities: [data_quality_profile, compare_period_phases, answer_verify]
    required_accepted_capabilities: [compare_period_phases]
    allowed_final_statuses: [passed, degraded]

  - case_id: phase6_pattern_channel_monthly
    source_case_id: full_wajespecial_vs_other_by_month
    primary_question_family: pattern_explanation
    secondary_question_families: []
    question: "WajeSpecial 渠道的月度日均付费金额是否稳定高于其他渠道合计？"
    review_focus: "渠道月度对比保持可解释降级，不把 route drift 固化成硬规则。"
    required_capabilities: [data_quality_profile, compare_periods, outlier_scan, answer_verify]
    required_accepted_capabilities: [compare_periods]
    allowed_final_statuses: [passed, degraded]

  - case_id: phase6_paid_amount_q2_driver
    source_case_id: driver_q2_vs_q1_paid_users
    primary_question_family: paid_amount_change_explanation
    secondary_question_families: []
    question: "2026年Q2相比Q1付费金额提升，主要是付费用户数增加还是单付费用户金额提升带来的？"
    review_focus: "驱动拆解给出贡献型答案，不能写成因果定论。"
    required_capabilities: [driver_decomposition, answer_verify]
    required_accepted_capabilities: [driver_decomposition]
    allowed_final_statuses: [passed]

  - case_id: phase6_paid_amount_channel_mix
    primary_question_family: paid_amount_change_explanation
    secondary_question_families: [segment_or_factor_attribution]
    question: "2026年Q2相比Q1付费金额变化里，不同渠道分别贡献了多少？"
    review_focus: "LLM 选择渠道贡献，Answer Package 保留证据 ref。"
    required_capabilities: [segment_contribution, answer_verify]
    required_accepted_capabilities: [segment_contribution]
    allowed_final_statuses: [passed, degraded]
    pattern_family: custom_baseline
    time_window: "2026-01-01..2026-06-30"
    scope: all_users
    baseline: {label: "2026年Q1", start: "2026-01-01", end: "2026-04-01"}
    target: {label: "2026年Q2", start: "2026-04-01", end: "2026-07-01"}
    pattern_params:
      period_key: channel
      group_key: group
      target_group: target
      baseline_group: baseline
    required_fields: [channel, group, amount]
    real_sql: |
      SELECT
        channel,
        if(business_date_lagos < toDate('2026-04-01'), 'baseline', 'target') AS `group`,
        sum(paid_amount_ngn) AS amount
      FROM paid_order_success_clean_20240101_20260704
      WHERE business_date_lagos >= toDate('2026-01-01')
        AND business_date_lagos < toDate('2026-07-01')
      GROUP BY channel, `group`
      ORDER BY channel, `group`

  - case_id: phase6_business_object_campaign
    primary_question_family: business_object_impact_review
    secondary_question_families: []
    question: "6月活动后付费金额有没有改善？"
    review_focus: "有事件假设时只能给候选影响和窗口对比，不能写成强因果。"
    required_capabilities: [event_evidence, compare_periods, answer_verify]
    required_accepted_capabilities: [event_evidence]
    allowed_final_statuses: [passed, degraded]
    pattern_family: custom_baseline
    time_window: "2026-06-01..2026-06-30"
    scope: all_users
    baseline: {label: "活动前", start: "2026-06-01", end: "2026-06-15"}
    target: {label: "活动后", start: "2026-06-15", end: "2026-07-01"}
    events:
      - event_name: "6月活动"
        event_window: "2026-06-15..2026-06-30"
        evidence_state: static_assumption
    pattern_params:
      period_key: period
      group_key: group
      target_group: target
      baseline_group: baseline
      min_periods: 1
    required_fields: [period, group, amount, days]
    real_sql: |
      SELECT
        'campaign_window' AS period,
        if(business_date_lagos < toDate('2026-06-15'), 'baseline', 'target') AS `group`,
        sum(paid_amount_ngn) AS amount,
        uniqExact(business_date_lagos) AS days
      FROM paid_order_success_clean_20240101_20260704
      WHERE business_date_lagos >= toDate('2026-06-01')
        AND business_date_lagos < toDate('2026-07-01')
      GROUP BY period, `group`
      ORDER BY period, `group`

  - case_id: phase6_segment_channel_attribution
    primary_question_family: segment_or_factor_attribution
    secondary_question_families: []
    question: "2026年Q2相比Q1，哪些渠道解释了付费金额变化？"
    review_focus: "渠道贡献排序要区分拉动和拖累，并保留弱证据边界。"
    required_capabilities: [segment_contribution, answer_verify]
    required_accepted_capabilities: [segment_contribution]
    allowed_final_statuses: [passed, degraded]
    pattern_family: custom_baseline
    time_window: "2026-01-01..2026-06-30"
    scope: all_users
    baseline: {label: "2026年Q1", start: "2026-01-01", end: "2026-04-01"}
    target: {label: "2026年Q2", start: "2026-04-01", end: "2026-07-01"}
    pattern_params:
      period_key: channel
      group_key: group
      target_group: target
      baseline_group: baseline
    required_fields: [channel, group, amount]
    real_sql: |
      SELECT
        channel,
        if(business_date_lagos < toDate('2026-04-01'), 'baseline', 'target') AS `group`,
        sum(paid_amount_ngn) AS amount
      FROM paid_order_success_clean_20240101_20260704
      WHERE business_date_lagos >= toDate('2026-01-01')
        AND business_date_lagos < toDate('2026-07-01')
      GROUP BY channel, `group`
      ORDER BY channel, `group`

  - case_id: phase6_segment_joint_candidate
    primary_question_family: segment_or_factor_attribution
    secondary_question_families: []
    question: "渠道和月内阶段组合是否解释了2026年Q2相比Q1的主要变化？"
    review_focus: "组合归因只能在一维贡献不足时作为候选补充。"
    required_capabilities: [segment_contribution, joint_attribution, answer_verify]
    required_accepted_capabilities: [segment_contribution]
    allowed_final_statuses: [passed, degraded]
    pattern_family: custom_baseline
    time_window: "2026-01-01..2026-06-30"
    scope: all_users
    segments:
      - segment: "channel_phase_candidate"
        amount: 1.0
        n: 100
    baseline: {label: "2026年Q1", start: "2026-01-01", end: "2026-04-01"}
    target: {label: "2026年Q2", start: "2026-04-01", end: "2026-07-01"}
    pattern_params:
      period_key: segment
      group_key: group
      target_group: target
      baseline_group: baseline
    required_fields: [segment, group, amount]
    real_sql: |
      SELECT
        concat(channel, '_', multiIf(toDayOfMonth(business_date_lagos) <= 10, 'start', toDayOfMonth(business_date_lagos) <= 20, 'mid', 'end')) AS segment,
        if(business_date_lagos < toDate('2026-04-01'), 'baseline', 'target') AS `group`,
        sum(paid_amount_ngn) AS amount
      FROM paid_order_success_clean_20240101_20260704
      WHERE business_date_lagos >= toDate('2026-01-01')
        AND business_date_lagos < toDate('2026-07-01')
      GROUP BY segment, `group`
      ORDER BY segment, `group`

  - case_id: phase6_revenue_health_h1
    primary_question_family: revenue_health_review
    secondary_question_families: []
    question: "2026年上半年付费金额健康度如何，主要风险在哪里？"
    review_focus: "健康度回答要同时看趋势、异常和数据质量，不给单点强结论。"
    required_capabilities: [data_quality_profile, formula_decompose, outlier_scan, answer_verify]
    required_accepted_capabilities: [data_quality_profile]
    allowed_final_statuses: [passed, degraded]
    pattern_family: rolling
    time_window: "2026-01-01..2026-06-30"
    scope: all_users
    pattern_params:
      period_key: period
      group_key: group
      target_group: target
      baseline_group: baseline
    required_fields: [period, amount]
    real_sql: |
      SELECT
        toString(business_date_lagos) AS period,
        'target' AS `group`,
        sum(paid_amount_ngn) AS amount
      FROM paid_order_success_clean_20240101_20260704
      WHERE business_date_lagos >= toDate('2026-01-01')
        AND business_date_lagos < toDate('2026-07-01')
      GROUP BY period, `group`
      ORDER BY period

  - case_id: phase6_anomaly_single_period
    primary_question_family: anomaly_or_black_swan_review
    secondary_question_families: []
    question: "2026年Q2的增长是不是被少数异常日期撑起来的？"
    review_focus: "异常贡献要回答集中度，不把少数日期写成确定原因。"
    required_capabilities: [outlier_contribution, outlier_scan, answer_verify]
    required_accepted_capabilities: [outlier_contribution]
    allowed_final_statuses: [passed, degraded]
    pattern_family: custom_baseline
    time_window: "2026-01-01..2026-06-30"
    scope: all_users
    baseline: {label: "2026年Q1同日序", start: "2026-01-01", end: "2026-04-01"}
    target: {label: "2026年Q2同日序", start: "2026-04-01", end: "2026-07-01"}
    pattern_params:
      period_key: day_index
      group_key: group
      target_group: target
      baseline_group: baseline
    required_fields: [day_index, group, amount]
    real_sql: |
      SELECT
        toString(if(business_date_lagos < toDate('2026-04-01'), dateDiff('day', toDate('2026-01-01'), business_date_lagos), dateDiff('day', toDate('2026-04-01'), business_date_lagos))) AS day_index,
        if(business_date_lagos < toDate('2026-04-01'), 'baseline', 'target') AS `group`,
        sum(paid_amount_ngn) AS amount
      FROM paid_order_success_clean_20240101_20260704
      WHERE business_date_lagos >= toDate('2026-01-01')
        AND business_date_lagos < toDate('2026-07-01')
      GROUP BY day_index, `group`
      ORDER BY day_index, `group`

  - case_id: phase6_custom_baseline_release
    primary_question_family: custom_baseline_comparison
    secondary_question_families: [paid_amount_change_explanation]
    question: "2026年6月下半月相比上半月付费金额有没有改善，主要由什么带来？"
    review_focus: "自定义基线先做窗口对比，再保留驱动拆解边界。"
    required_capabilities: [compare_periods, driver_decomposition, answer_verify]
    required_accepted_capabilities: [compare_periods]
    allowed_final_statuses: [passed, degraded]
    pattern_family: custom_baseline
    time_window: "2026-06-01..2026-06-30"
    scope: all_users
    baseline: {label: "6月上半月", start: "2026-06-01", end: "2026-06-15"}
    target: {label: "6月下半月", start: "2026-06-15", end: "2026-07-01"}
    pattern_params:
      period_key: period
      group_key: group
      target_group: target
      baseline_group: baseline
      min_periods: 1
    required_fields: [period, group, amount, paid_users, orders]
    real_sql: |
      SELECT
        'june_split' AS period,
        if(business_date_lagos < toDate('2026-06-15'), 'baseline', 'target') AS `group`,
        sum(paid_amount_ngn) AS amount,
        uniqExact(user_id) AS paid_users,
        count() AS orders
      FROM paid_order_success_clean_20240101_20260704
      WHERE business_date_lagos >= toDate('2026-06-01')
        AND business_date_lagos < toDate('2026-07-01')
      GROUP BY period, `group`
      ORDER BY period, `group`

  - case_id: phase6_data_quality_trust
    primary_question_family: data_quality_or_evidence_review
    secondary_question_families: []
    question: "当前付费数据能不能支撑渠道对比结论？"
    review_focus: "只回答数据覆盖和证据边界，不伪装成业务增长结论。"
    required_capabilities: [data_quality_profile, answer_verify]
    required_accepted_capabilities: [data_quality_profile]
    allowed_final_statuses: [passed, degraded]
    pattern_family: custom_baseline
    time_window: "2026-01-01..2026-06-30"
    scope: all_users
    pattern_params:
      period_key: channel
      group_key: group
      target_group: target
      baseline_group: baseline
    required_fields: [channel, group, amount]
    real_sql: |
      SELECT
        channel,
        if(business_date_lagos < toDate('2026-04-01'), 'baseline', 'target') AS `group`,
        sum(paid_amount_ngn) AS amount
      FROM paid_order_success_clean_20240101_20260704
      WHERE business_date_lagos >= toDate('2026-01-01')
        AND business_date_lagos < toDate('2026-07-01')
      GROUP BY channel, `group`
      ORDER BY channel, `group`

  - case_id: phase6_composite_change_and_reason
    primary_question_family: paid_amount_change_explanation
    secondary_question_families: [segment_or_factor_attribution]
    question: "2026年Q2为什么增长，主要渠道和付费用户数/单付费用户金额分别怎么贡献？"
    review_focus: "复合意图要保留整体变化、渠道贡献和驱动拆解三条业务线。"
    required_capabilities: [driver_decomposition, segment_contribution, answer_verify]
    required_accepted_capabilities: [driver_decomposition, segment_contribution]
    allowed_final_statuses: [passed, degraded]
    pattern_family: custom_baseline
    time_window: "2026-01-01..2026-06-30"
    scope: all_users
    baseline: {label: "2026年Q1", start: "2026-01-01", end: "2026-04-01"}
    target: {label: "2026年Q2", start: "2026-04-01", end: "2026-07-01"}
    pattern_params:
      period_key: channel
      group_key: group
      target_group: target
      baseline_group: baseline
    required_fields: [channel, group, amount, paid_users, orders]
    real_sql: |
      SELECT
        channel,
        if(business_date_lagos < toDate('2026-04-01'), 'baseline', 'target') AS `group`,
        sum(paid_amount_ngn) AS amount,
        uniqExact(user_id) AS paid_users,
        count() AS orders
      FROM paid_order_success_clean_20240101_20260704
      WHERE business_date_lagos >= toDate('2026-01-01')
        AND business_date_lagos < toDate('2026-07-01')
      GROUP BY channel, `group`
      ORDER BY channel, `group`
