cases:
  - case_id: full_month_start_vs_mid_end
    case_group: historical_risk_recheck
    question: "全量样本看，2024-01到2026-06每个月月初1-10号付费金额是否高于月中和月末？"
    pattern_family: intra_period
    time_window: "2024-01-01..2026-06-30"
    expected_status: degraded
    pattern_params:
      period_key: month
      group_key: phase
      target_phase: start
      min_periods: 30
    required_capabilities:
      - data_quality_profile
      - compare_period_phases
      - answer_verify
    real_sql: |
      WITH daily AS (
        SELECT
          formatDateTime(toStartOfMonth(business_date_lagos), '%Y-%m') AS month,
          toDayOfMonth(business_date_lagos) AS dom,
          sum(paid_amount_ngn) AS amount
        FROM paid_order_success_clean_20240101_20260704
        WHERE business_date_lagos >= toDate('2024-01-01')
          AND business_date_lagos < toDate('2026-07-01')
        GROUP BY month, dom
      )
      SELECT
        month,
        multiIf(dom <= 10, 'start', dom <= 20, 'mid', 'end') AS phase,
        sum(amount) AS amount,
        count() AS days
      FROM daily
      GROUP BY month, phase
      ORDER BY month, phase

  - case_id: full_month_boundary_vs_mid
    case_group: historical_risk_recheck
    question: "全量样本看，2024-01到2026-06每个月月边界窗口（1-8号或26号以后）相比月中是否更高？"
    pattern_family: intra_period
    time_window: "2024-01-01..2026-06-30"
    expected_status: degraded
    pattern_params:
      period_key: month
      group_key: phase
      target_phase: boundary
      min_periods: 30
    required_capabilities:
      - data_quality_profile
      - compare_period_phases
      - answer_verify
    real_sql: |
      WITH daily AS (
        SELECT
          formatDateTime(toStartOfMonth(business_date_lagos), '%Y-%m') AS month,
          toDayOfMonth(business_date_lagos) AS dom,
          sum(paid_amount_ngn) AS amount
        FROM paid_order_success_clean_20240101_20260704
        WHERE business_date_lagos >= toDate('2024-01-01')
          AND business_date_lagos < toDate('2026-07-01')
        GROUP BY month, dom
      )
      SELECT
        month,
        if(dom <= 8 OR dom >= 26, 'boundary', 'mid') AS phase,
        sum(amount) AS amount,
        count() AS days
      FROM daily
      WHERE dom <= 8 OR dom >= 26 OR (dom >= 11 AND dom <= 20)
      GROUP BY month, phase
      ORDER BY month, phase

  - case_id: full_thu_fri_vs_mon_sun
    case_group: historical_risk_recheck
    question: "全量样本看，周四/周五的付费金额是否稳定高于周一/周日？"
    pattern_family: weekly
    time_window: "2024-01-01..2026-06-30"
    expected_status: degraded
    pattern_params:
      week_key: week
      weekday_key: weekday
      target_weekdays: [4, 5]
      baseline_weekdays: [1, 7]
      min_periods: 120
    required_capabilities:
      - data_quality_profile
      - weekday_calendar_compare
      - answer_verify
    real_sql: |
      WITH daily AS (
        SELECT
          toMonday(business_date_lagos) AS week,
          toDayOfWeek(business_date_lagos) AS weekday,
          sum(paid_amount_ngn) AS amount
        FROM paid_order_success_clean_20240101_20260704
        WHERE business_date_lagos >= toDate('2024-01-01')
          AND business_date_lagos < toDate('2026-07-01')
        GROUP BY week, weekday
      ), full_weeks AS (
        SELECT week
        FROM daily
        GROUP BY week
        HAVING count() = 7
      )
      SELECT
        formatDateTime(week, '%Y-%m-%d') AS week,
        weekday,
        amount
      FROM daily
      INNER JOIN full_weeks USING week
      ORDER BY week, weekday

  - case_id: full_rolling_28_day_growth
    case_group: historical_risk_recheck
    question: "全量样本看，28日滚动付费金额是否呈持续增长模式？"
    pattern_family: rolling
    scope:
      type: all
    time_window: "2024-01-28..2026-06-30"
    expected_status: passed
    pattern_params:
      period_key: window
      min_periods: 24
    required_capabilities:
      - data_quality_profile
      - rolling_window_compare
      - answer_verify
    real_sql: |
      WITH daily AS (
        SELECT
          business_date_lagos AS d,
          sum(paid_amount_ngn) AS amount
        FROM paid_order_success_clean_20240101_20260704
        WHERE business_date_lagos >= toDate('2024-01-01')
          AND business_date_lagos < toDate('2026-07-01')
        GROUP BY d
      ), roll AS (
        SELECT
          d,
          avg(amount) OVER (ORDER BY d ROWS BETWEEN 27 PRECEDING AND CURRENT ROW) AS avg28
        FROM daily
      ), monthly AS (
        SELECT
          toStartOfMonth(d) AS m,
          avg(avg28) AS amount
        FROM roll
        WHERE d >= toDate('2024-01-28')
        GROUP BY m
      )
      SELECT
        formatDateTime(curr.m, '%Y-%m') AS window,
        curr.amount AS amount,
        prev.amount AS baseline_high
      FROM monthly curr
      INNER JOIN monthly prev ON curr.m = addMonths(prev.m, 1)
      ORDER BY curr.m

  - case_id: full_2026_q2_vs_q1
    case_group: historical_risk_recheck
    question: "2026年Q2相比Q1，日均付费金额有没有明显抬升？"
    pattern_family: custom_baseline
    time_window: "2026-01-01..2026-06-30"
    expected_status: passed
    baseline:
      label: "2026年Q1"
      start: "2026-01-01"
      end: "2026-04-01"
    target:
      label: "2026年Q2"
      start: "2026-04-01"
      end: "2026-07-01"
    pattern_params:
      period_key: period
      group_key: group
      target_group: target
      baseline_group: baseline
      min_periods: 1
    required_capabilities:
      - data_quality_profile
      - compare_periods
      - answer_verify
    real_sql: |
      WITH daily AS (
        SELECT
          business_date_lagos AS d,
          sum(paid_amount_ngn) AS amount
        FROM paid_order_success_clean_20240101_20260704
        WHERE business_date_lagos >= toDate('2026-01-01')
          AND business_date_lagos < toDate('2026-07-01')
        GROUP BY d
      )
      SELECT
        '2026_h1' AS period,
        'baseline' AS `group`,
        avg(amount) AS amount
      FROM daily
      WHERE d < toDate('2026-04-01')
      UNION ALL
      SELECT
        '2026_h1' AS period,
        'target' AS `group`,
        avg(amount) AS amount
      FROM daily
      WHERE d >= toDate('2026-04-01')

  - case_id: full_month_end_vs_mid
    case_group: random_seed_407
    question: "全量样本看，2024-01到2026-06每个月月末21号以后付费金额是否高于月中？"
    pattern_family: intra_period
    time_window: "2024-01-01..2026-06-30"
    expected_status: degraded
    pattern_params:
      period_key: month
      group_key: phase
      target_phase: end
      min_periods: 30
    required_capabilities:
      - data_quality_profile
      - compare_period_phases
      - answer_verify
    real_sql: |
      WITH daily AS (
        SELECT
          formatDateTime(toStartOfMonth(business_date_lagos), '%Y-%m') AS month,
          toDayOfMonth(business_date_lagos) AS dom,
          sum(paid_amount_ngn) AS amount
        FROM paid_order_success_clean_20240101_20260704
        WHERE business_date_lagos >= toDate('2024-01-01')
          AND business_date_lagos < toDate('2026-07-01')
        GROUP BY month, dom
      )
      SELECT
        month,
        if(dom >= 21, 'end', 'mid') AS phase,
        sum(amount) AS amount,
        count() AS days
      FROM daily
      WHERE dom >= 21 OR (dom >= 11 AND dom <= 20)
      GROUP BY month, phase
      ORDER BY month, phase

  - case_id: full_wajespecial_vs_other_by_month
    case_group: random_seed_407
    question: "全量样本看，WajeSpecial渠道的月度日均付费金额是否稳定高于其他渠道合计？"
    pattern_family: custom_baseline
    time_window: "2024-01-01..2026-06-30"
    expected_status: degraded
    baseline:
      label: "其他渠道合计"
    target:
      label: "WajeSpecial渠道"
    pattern_params:
      period_key: period
      group_key: group
      target_group: target
      baseline_group: baseline
      min_periods: 30
    required_capabilities:
      - data_quality_profile
      - compare_periods
      - answer_verify
    real_sql: |
      WITH daily AS (
        SELECT
          formatDateTime(toStartOfMonth(business_date_lagos), '%Y-%m') AS period,
          business_date_lagos AS d,
          if(channel = 'WajeSpecial', 'target', 'baseline') AS `group`,
          sum(paid_amount_ngn) AS amount
        FROM paid_order_success_clean_20240101_20260704
        WHERE business_date_lagos >= toDate('2024-01-01')
          AND business_date_lagos < toDate('2026-07-01')
        GROUP BY period, d, `group`
      )
      SELECT
        period,
        `group`,
        sum(amount) AS amount,
        count() AS days
      FROM daily
      GROUP BY period, `group`
      ORDER BY period, `group`

  - case_id: full_weekend_vs_workday
    case_group: random_seed_407
    question: "全量样本看，周末付费金额是否稳定高于工作日？"
    pattern_family: weekly
    time_window: "2024-01-01..2026-06-30"
    expected_status: degraded
    pattern_params:
      week_key: week
      weekday_key: weekday
      target_weekdays: [6, 7]
      baseline_weekdays: [1, 2, 3, 4, 5]
      min_periods: 120
    required_capabilities:
      - data_quality_profile
      - weekday_calendar_compare
      - answer_verify
    real_sql: |
      WITH daily AS (
        SELECT
          toMonday(business_date_lagos) AS week,
          toDayOfWeek(business_date_lagos) AS weekday,
          sum(paid_amount_ngn) AS amount
        FROM paid_order_success_clean_20240101_20260704
        WHERE business_date_lagos >= toDate('2024-01-01')
          AND business_date_lagos < toDate('2026-07-01')
        GROUP BY week, weekday
      ), full_weeks AS (
        SELECT week
        FROM daily
        GROUP BY week
        HAVING count() = 7
      )
      SELECT
        formatDateTime(week, '%Y-%m-%d') AS week,
        weekday,
        amount
      FROM daily
      INNER JOIN full_weeks USING week
      ORDER BY week, weekday

  - case_id: full_december_vs_november
    case_group: random_seed_407
    question: "全量样本看，12月相比11月的日均付费金额是否更高？"
    pattern_family: custom_baseline
    time_window: "2024-01-01..2026-06-30"
    expected_status: passed
    baseline:
      label: "11月"
    target:
      label: "12月"
    pattern_params:
      period_key: period
      group_key: group
      target_group: target
      baseline_group: baseline
      min_periods: 2
    required_capabilities:
      - data_quality_profile
      - compare_periods
      - answer_verify
    real_sql: |
      SELECT
        toString(toYear(business_date_lagos)) AS period,
        if(toMonth(business_date_lagos) = 12, 'target', 'baseline') AS `group`,
        sum(paid_amount_ngn) AS amount,
        uniqExact(business_date_lagos) AS days
      FROM paid_order_success_clean_20240101_20260704
      WHERE business_date_lagos >= toDate('2024-01-01')
        AND business_date_lagos < toDate('2026-07-01')
        AND toMonth(business_date_lagos) IN (11, 12)
      GROUP BY period, `group`
      ORDER BY period, `group`

  - case_id: full_q2_vs_q1_by_year
    case_group: random_seed_407
    question: "全量样本看，每年Q2相比Q1的日均付费金额是否都有抬升？"
    pattern_family: custom_baseline
    time_window: "2024-01-01..2026-06-30"
    expected_status: degraded
    baseline:
      label: "Q1"
    target:
      label: "Q2"
    pattern_params:
      period_key: period
      group_key: group
      target_group: target
      baseline_group: baseline
      min_periods: 3
    required_capabilities:
      - data_quality_profile
      - compare_periods
      - answer_verify
    real_sql: |
      SELECT
        toString(toYear(business_date_lagos)) AS period,
        if(toMonth(business_date_lagos) >= 4, 'target', 'baseline') AS `group`,
        sum(paid_amount_ngn) AS amount,
        uniqExact(business_date_lagos) AS days
      FROM paid_order_success_clean_20240101_20260704
      WHERE business_date_lagos >= toDate('2024-01-01')
        AND business_date_lagos < toDate('2026-07-01')
        AND toMonth(business_date_lagos) BETWEEN 1 AND 6
      GROUP BY period, `group`
      ORDER BY period, `group`
