version: "0.1"
artifact: launch_eval_expectation_packages
scope: Phase 2 launch eval design input for graph compiler, Answer Package, verifier, and Phase 3 semantic evidence prep.
source_refs:
  - docs/prd.md
  - docs/product-decisions.md
  - docs/phase-2-graph-compiler-prep.md
  - contracts/ledger/capability-support.yaml
  - contracts/backlog/missing-contracts.yaml
source_pools:
  - real_user_questions
  - historical_failure_cases
  - matrix_generated_boundary_cases
compiler_outcomes:
  - accept
  - auto_repair
  - targeted_repair
  - degrade
  - block

expectation_packages:
  - case_id: LE-001
    title: Full-sample month-start paid_amount pattern
    source_pool: historical_failure_cases
    natural_user_wording: 全量样本看，为什么从 2024 年 1 月开始到 2026 年 5 月结束，为什么每个月月初的付费金额都比月中/月末高一些
    expected_question_family: pattern_explanation
    merged_question_families:
      - data_quality_or_evidence_review
      - segment_or_factor_attribution
    intent:
      target_metric: paid_amount
      scope: full_sample
      time_range: "2024-01 through 2026-05"
      grain: month_phase
      pattern_family: intra_period
      window_definition: month_start_1_10_mid_11_20_end_21_month_end
      baseline: same_month_phase
    required_capabilities:
      - data_quality_check
      - pattern_scan
      - event_evidence
      - outlier_scan
      - answer_verify
    optional_capabilities:
      - formula_decompose
      - segment_bridge
      - joint_attribution
    forbidden_capabilities: []
    expected_compiler_actions:
      - outcome: auto_repair
        reason: add data_quality_check, contract pins, current-data snapshot, cumulative-value guard, materiality guard, and answer_verify.
      - outcome: degrade
        reason: time-boundary and current-data limitations must flow through timezone_policy until fully executable source-time rules are reviewed.
      - outcome: block
        reason: cumulative month-to-date values cannot support month-phase shape claims.
    expected_evidence_contract_states:
      - support_id: pattern_month_phase_paid_amount
        business_evidence_state: insufficient
        data_contract_state: missing_contract
        evidence_type: statistical_association
        strength: insufficient
        wording_limit: insufficient
        backlog_refs:
          - timezone_policy
      - support_id: event_pattern_payday_dimension
        business_evidence_state: candidate_mechanism
        data_contract_state: static_assumption
        evidence_type: candidate_mechanism
        strength: low
        wording_limit: candidate
        backlog_refs: []
    allowed_claims:
      - claim_type: recurring_pattern_existence
        evidence_type: statistical_association
        strength: medium
        wording_limit: stable_pattern
        condition: recurrence, effect size, stability, exceptions, and data-quality checks pass.
      - claim_type: payday_dimension_candidate_mechanism
        evidence_type: candidate_mechanism
        strength: low
        wording_limit: candidate
        condition: payday is framed as candidate mechanism only.
    expected_visual_blocks:
      - phase_comparison
      - exception_list
      - candidate_explanation_ranking
      - evidence_boundary
    verifier_checks:
      - question_family_is_pattern_explanation
      - no_period_over_period_or_cost_period_misclassification
      - cumulative_value_misuse_is_blocked
      - tested_windows_and_exceptions_have_evidence_refs
      - candidate_mechanisms_keep_candidate_wording
      - degraded_or_blocked_paths_are_visible
    semantic_evidence_expectations:
      semantic_query_records:
        - capability: pattern_scan
          support_id: pattern_month_phase_paid_amount
          semantic_query_status: degraded_or_accepted_with_limits
          required_bindings:
            - metric_scope_grain_time_window_baseline
            - contract_version_pins
            - current_data_snapshot
            - materiality_guard
            - cumulative_value_guard
            - data_quality_handoff
        - capability: event_evidence
          support_id: event_pattern_payday_dimension
          semantic_query_status: accepted_with_candidate_limit
          required_bindings:
            - payday_static_assumption_ref
            - event_window
            - wording_limit_candidate
      evidence_envelopes:
        - support_id: pattern_month_phase_paid_amount
          typed_payload: pattern_scan_result
          evidence_type: statistical_association
          strength: insufficient
          wording_limit: insufficient
          limitation_refs:
            - timezone_policy
        - support_id: event_pattern_payday_dimension
          typed_payload: event_evidence_result
          evidence_type: candidate_mechanism
          strength: low
          wording_limit: candidate
      answer_package_handoff:
        - pattern_claims_require_tested_window_evidence_refs
        - cumulative_value_path_refs_block_claim
        - payday_claim_stays_candidate_mechanism
    failure_attribution:
      business_failure_types:
        - wrong_question_family
        - wrong_baseline
        - over_strong_weak_evidence
        - hidden_data_gap
      system_responsibility_points:
        - LLM_reasoner
        - graph_compiler
        - answer_verifier
        - visualization_planner

  - case_id: LE-002
    title: Weekly operating paid_amount change explanation
    source_pool: real_user_questions
    natural_user_wording: 上周付费金额为什么下降，主要驱动是什么？
    expected_question_family: paid_amount_change_explanation
    merged_question_families:
      - segment_or_factor_attribution
      - data_quality_or_evidence_review
    intent:
      target_metric: paid_amount
      scope: overall_business
      time_range: last_complete_week
      grain: day
      baseline: prior_comparable_week_or_question_tool_if_material
    required_capabilities:
      - data_quality_check
      - formula_decompose
      - segment_bridge
      - answer_verify
    optional_capabilities:
      - pattern_scan
      - joint_attribution
      - event_evidence
      - outlier_scan
    forbidden_capabilities: []
    expected_compiler_actions:
      - outcome: accept
        reason: metric source quality, formula, and supported segment paths are legitimate compile routes when params bind to contracts.
      - outcome: auto_repair
        reason: add current-data snapshot, contract pins, materiality guard, and verifier node.
      - outcome: targeted_repair
        reason: unclear baseline or target claim gets bounded repair or question tool.
      - outcome: degrade
        reason: growth-operation attribution remains limited by missing operation, spend, and exposure/control contracts.
    expected_evidence_contract_states:
      - support_id: dq_paid_amount_change_metric_source
        business_evidence_state: quantifiable
        data_contract_state: contract_backed
        evidence_type: insufficient
        strength: high
        wording_limit: context
        backlog_refs:
          - timezone_policy
          - payment_status_and_dedup_contract
      - support_id: formula_paid_amount_change_order_chain
        business_evidence_state: quantifiable
        data_contract_state: evidence_linked
        evidence_type: accounting_contribution
        strength: medium
        wording_limit: quantified
        backlog_refs:
          - component_contracts
          - payment_status_and_dedup_contract
      - support_id: attribution_paid_amount_change_growth_ops
        business_evidence_state: insufficient
        data_contract_state: missing_contract
        evidence_type: statistical_association
        strength: insufficient
        wording_limit: insufficient
        backlog_refs:
          - channel_payment_dimension_contracts
          - product_operation_event_contracts
          - exposure_control_contracts
    allowed_claims:
      - claim_type: formula_component_contribution
        evidence_type: accounting_contribution
        strength: medium
        wording_limit: quantified
        condition: declared decomposition path and reconciliation are present.
      - claim_type: multi_factor_operating_explanation
        evidence_type: statistical_association
        strength: insufficient
        wording_limit: insufficient
        condition: missing spend, operation, exposure, and control contracts block campaign attribution, ROI, ROAS, CPA, and net impact.
    expected_visual_blocks:
      - formula_contribution
      - segment_bridge
      - baseline_stability
      - limitation
    verifier_checks:
      - baseline_is_bound_or_clarified
      - contribution_wording_is_not_causal_wording
      - formula_claim_has_evidence_refs_and_reconciliation
      - growth_operation_gaps_are_visible
    semantic_evidence_expectations:
      semantic_query_records:
        - capability: formula_decompose
          support_id: formula_paid_amount_change_order_chain
          semantic_query_status: accepted_or_degraded_by_component_coverage
          required_bindings:
            - declared_metric_decomposition_path
            - target_and_baseline_windows
            - contract_version_pins
            - current_data_snapshot
            - formula_reconciliation_guard
        - capability: segment_bridge
          support_id: segment_paid_amount_change_payment_method
          semantic_query_status: accepted_at_supported_grain
          required_bindings:
            - dimension_refs
            - restricted_output_policy
            - supported_grain
      evidence_envelopes:
        - support_id: formula_paid_amount_change_order_chain
          typed_payload: formula_decompose_result
          evidence_type: accounting_contribution
          strength: medium
          wording_limit: quantified
          numeric_reconciliation: required
        - support_id: attribution_paid_amount_change_growth_ops
          typed_payload: joint_attribution_result
          evidence_type: statistical_association
          strength: insufficient
          wording_limit: insufficient
          limitation_refs:
            - channel_payment_dimension_contracts
            - product_operation_event_contracts
            - exposure_control_contracts
      answer_package_handoff:
        - formula_numbers_bind_evidence_refs_and_reconciliation
        - contribution_wording_stays_separate_from_cause_wording
        - operation_gap_path_refs_are_visible
    failure_attribution:
      business_failure_types:
        - wrong_baseline
        - missed_key_factor
        - over_strong_weak_evidence
        - hidden_data_gap
      system_responsibility_points:
        - LLM_reasoner
        - graph_compiler
        - semantic_compiler
        - evidence_reducer
        - answer_verifier

  - case_id: LE-003
    title: Recharge activity impact review with missing operation contracts
    source_pool: matrix_generated_boundary_cases
    natural_user_wording: 6 月充值活动对付费金额影响多大？
    expected_question_family: business_object_impact_review
    merged_question_families:
      - custom_baseline_comparison
      - data_quality_or_evidence_review
    intent:
      target_metric: paid_amount
      scope: named_business_object
      time_range: "2026-06"
      grain: event_window_when_contract_exists
      business_object: recharge_activity
      baseline: pre_post_or_control_window_requires_contract_review
    required_capabilities:
      - event_evidence
      - data_quality_check
      - answer_verify
    optional_capabilities:
      - formula_decompose
      - segment_bridge
      - joint_attribution
    forbidden_capabilities: []
    expected_compiler_actions:
      - outcome: targeted_repair
        reason: missing event identity, affected scope, or control window requires bounded repair.
      - outcome: degrade
        reason: recharge activity has missing product-operation and exposure/control contracts.
      - outcome: block
        reason: confirmed net impact wording is blocked without event timing, exposure, affected scope, and control evidence.
    expected_evidence_contract_states:
      - support_id: event_business_object_product_operation
        business_evidence_state: insufficient
        data_contract_state: missing_contract
        evidence_type: candidate_mechanism
        strength: insufficient
        wording_limit: insufficient
        backlog_refs:
          - product_operation_event_contracts
          - exposure_control_contracts
    allowed_claims:
      - claim_type: business_object_candidate_impact
        evidence_type: candidate_mechanism
        strength: insufficient
        wording_limit: insufficient
        condition: activity path remains a visible missing-contract limitation.
    expected_visual_blocks:
      - business_object_view
      - event_timeline_view
      - evidence_boundary
    verifier_checks:
      - named_object_maps_to_event_or_backlog
      - control_or_baseline_boundary_is_visible
      - impact_wording_does_not_exceed_evidence
      - missing_exposure_and_operation_contracts_are_visible
    semantic_evidence_expectations:
      semantic_query_records:
        - capability: event_evidence
          support_id: event_business_object_product_operation
          semantic_query_status: degraded_or_blocked
          required_bindings:
            - business_object_identity_or_backlog_ref
            - event_window_or_repair_request
            - affected_scope_when_available
            - control_or_baseline_boundary
            - contract_version_pins
            - current_data_snapshot
      evidence_envelopes:
        - support_id: event_business_object_product_operation
          typed_payload: event_evidence_result
          evidence_type: candidate_mechanism
          strength: insufficient
          wording_limit: insufficient
          limitation_refs:
            - product_operation_event_contracts
            - exposure_control_contracts
      answer_package_handoff:
        - confirmed_net_impact_claim_is_blocked
        - campaign_roi_roas_cpa_claims_are_blocked_without_spend_exposure_control_contracts
        - missing_event_exposure_control_refs_enter_limitation
        - visual_blocks_bind_event_evidence_refs
    failure_attribution:
      business_failure_types:
        - unsupported_main_conclusion
        - hidden_data_gap
        - wrong_scope
        - over_strong_weak_evidence
      system_responsibility_points:
        - LLM_reasoner
        - graph_compiler
        - semantic_compiler
        - answer_verifier

