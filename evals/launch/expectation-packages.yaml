  - case_id: LE-005
    title: Channel and payment-method segment attribution
    source_pool: matrix_generated_boundary_cases
    natural_user_wording: 哪些渠道和支付方式解释了这段时间付费金额变化？
    expected_question_family: segment_or_factor_attribution
    merged_question_families:
      - paid_amount_change_explanation
      - data_quality_or_evidence_review
    intent:
      target_metric: paid_amount
      scope: selected_time_window
      time_range: user_selected_or_recent_complete_window
      grain: channel_and_payment_method
      baseline: prior_comparable_window
    required_capabilities:
      - data_quality_check
      - segment_bridge
      - joint_attribution
      - answer_verify
    optional_capabilities:
      - formula_decompose
    forbidden_capabilities: []
    expected_compiler_actions:
      - outcome: accept
        reason: channel and payment-method segment bridge can use current contract-backed dimensions at supported grains.
      - outcome: targeted_repair
        reason: joint_attribution candidate pool must resolve to ledger, contracts, evidence, or backlog refs.
      - outcome: degrade
        reason: campaign, spend, creative, SEO/GEO, referral, and exposure paths remain missing-contract limitations.
      - outcome: block
        reason: raw user, IP, device, or individual-user output is forbidden.
    expected_evidence_contract_states:
      - support_id: segment_attribution_payment_method
        business_evidence_state: quantifiable
        data_contract_state: contract_backed
        evidence_type: accounting_contribution
        strength: medium
        wording_limit: quantified
        backlog_refs:
          - channel_payment_dimension_contracts
      - support_id: joint_attribution_geo_device_contract_backed
        business_evidence_state: quantifiable
        data_contract_state: contract_backed
        evidence_type: statistical_association
        strength: medium
        wording_limit: candidate
        backlog_refs:
          - geo_device_environment_quality_policy
    allowed_claims:
      - claim_type: segment_contribution_or_mix_shift
        evidence_type: accounting_contribution
        strength: medium
        wording_limit: quantified
        condition: supported segment grain, coverage, and sparse limits pass.
      - claim_type: geo_device_combination_attribution
        evidence_type: statistical_association
        strength: medium
        wording_limit: candidate
        condition: aggregate reviewed dimensions pass coverage and sparse-cell checks; raw identifier values remain blocked for every user.
    expected_visual_blocks:
      - attribution_ranking
      - combination_path
      - stability_coverage
      - restricted_output_limit
    verifier_checks:
      - attribution_claim_states_scope_and_grain
      - contribution_is_not_causal_wording
      - raw_identifier_output_is_absent
      - restricted_output_paths_are_visible_when_relevant
    semantic_evidence_expectations:
      semantic_query_records:
        - capability: segment_bridge
          support_id: segment_attribution_payment_method
          semantic_query_status: accepted_at_supported_grain
          required_bindings:
            - channel_and_payment_method_dimension_refs
            - requested_and_accepted_grain
            - restricted_output_policy
            - sparse_cell_guard
        - capability: joint_attribution
          support_id: joint_attribution_geo_device_contract_backed
          semantic_query_status: accepted_at_supported_aggregate_grain
          required_bindings:
            - geo_device_dimension_refs
            - requested_and_accepted_grain
            - restricted_output_policy
            - sparse_cell_guard
      evidence_envelopes:
        - support_id: segment_attribution_payment_method
          typed_payload: segment_bridge_result
          evidence_type: accounting_contribution
          strength: medium
          wording_limit: quantified
          numeric_reconciliation: required
        - support_id: joint_attribution_geo_device_contract_backed
          typed_payload: joint_attribution_result
          evidence_type: statistical_association
          strength: medium
          wording_limit: candidate
          limitation_refs:
            - geo_device_environment_quality_policy
      answer_package_handoff:
        - attribution_claims_bind_scope_grain_and_evidence_refs
        - raw_user_and_order_identifier_output_is_blocked
        - restricted_output_path_refs_are_visible_when_relevant
    failure_attribution:
      business_failure_types:
        - restricted_output_leak
        - unsupported_main_conclusion
        - over_strong_weak_evidence
        - misleading_visualization
      system_responsibility_points:
        - graph_compiler
        - semantic_compiler
        - restricted_output_policy
        - answer_verifier
        - visualization_planner

  - case_id: LE-006
    title: Anomaly and black-swan review without raw external crawling
    source_pool: historical_failure_cases
    natural_user_wording: 6 月这几天异常吗，可能和外部黑天鹅有关吗？
    expected_question_family: anomaly_or_black_swan_review
    merged_question_families:
      - data_quality_or_evidence_review
      - business_object_impact_review
    intent:
      target_metric: paid_amount
      scope: suspected_anomaly_window
      time_range: "2026-06 selected days"
      grain: day
      baseline: expected_baseline_or_targeted_repair
    required_capabilities:
      - data_quality_check
      - outlier_scan
      - event_evidence
      - answer_verify
    optional_capabilities:
      - segment_bridge
      - joint_attribution
    forbidden_capabilities: []
    expected_compiler_actions:
      - outcome: auto_repair
        reason: data_quality_check is required before anomaly claims.
      - outcome: targeted_repair
        reason: outlier_scan must declare baseline or anomaly definition.
      - outcome: degrade
        reason: external events can support context or candidate mechanisms only.
      - outcome: block
        reason: raw web, news, forum, media crawling, and live AnySearch-like connectors are outside launch scope.
    expected_evidence_contract_states:
      - support_id: outlier_black_swan_external_context
        business_evidence_state: contextual_evidence
        data_contract_state: evidence_linked
        evidence_type: candidate_mechanism
        strength: low
        wording_limit: context
        backlog_refs:
          - external_context_event_contracts
      - support_id: event_black_swan_raw_external_ingestion_scope
        business_evidence_state: out_of_scope
        data_contract_state: out_of_scope_for_now
        evidence_type: insufficient
        strength: insufficient
        wording_limit: blocked
        backlog_refs:
          - raw_external_evidence_ingestion_scope
    allowed_claims:
      - claim_type: external_shock_candidate_or_anomaly
        evidence_type: candidate_mechanism
        strength: low
        wording_limit: context
        condition: reviewed event/evidence records support context only.
      - claim_type: raw_external_crawl_claim
        evidence_type: insufficient
        strength: insufficient
        wording_limit: blocked
        condition: raw external ingestion and live AnySearch-style lookup remain out of scope.
    expected_visual_blocks:
      - anomaly_scope
      - event_context_timeline
      - ruled_out_paths
      - evidence_boundary
    verifier_checks:
      - anomaly_claim_states_baseline
      - black_swan_wording_stays_candidate_or_context
      - raw_external_ingestion_is_blocked
      - data_quality_flags_are_visible
    semantic_evidence_expectations:
      semantic_query_records:
        - capability: outlier_scan
          support_id: outlier_black_swan_external_context
          semantic_query_status: degraded_with_context_limit
          required_bindings:
            - anomaly_definition_or_baseline
            - data_quality_handoff
            - current_data_snapshot
        - capability: event_evidence
          support_id: event_black_swan_raw_external_ingestion_scope
          semantic_query_status: blocked
          required_bindings:
            - raw_external_ingestion_scope_block
            - limitation_refs
      evidence_envelopes:
        - support_id: outlier_black_swan_external_context
          typed_payload: outlier_scan_result
          evidence_type: candidate_mechanism
          strength: low
          wording_limit: context
        - support_id: event_black_swan_raw_external_ingestion_scope
          typed_payload: event_evidence_result
          evidence_type: insufficient
          strength: insufficient
          wording_limit: blocked
          limitation_refs:
            - raw_external_ingestion_phase1_scope
      answer_package_handoff:
        - anomaly_claims_bind_baseline_and_quality_refs
        - black_swan_claim_stays_candidate_or_context
        - raw_external_path_refs_block_final_claim_and_visual
    failure_attribution:
      business_failure_types:
        - over_strong_weak_evidence
        - hidden_data_gap
