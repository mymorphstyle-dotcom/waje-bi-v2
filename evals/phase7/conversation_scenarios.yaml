artifact_policy: natural_language_conversation_runtime_only
minimum_cases: 60
groups:
  continuous_follow_up: 20
  mixed_question: 10
  offtopic_capability_unsupported: 10
  permission_snapshot_memory: 10
  correction_challenge_clarification: 10
cases:
  - case_id: cf_001
    group: continuous_follow_up
    user_message: "Q2 比 Q1 付费金额为什么变了？"
    expected_intent: new_topic
    expected_topic_relation: new_topic
    expected_reuse: rerun
    expected_context_use: ["recent_turns"]
    expected_forbidden_context: ["old_unmatched_topic_result"]
    expected_langgraph: {nodes: ["business_intent", "answer_verify"], ask_question: false, degraded: false}
    expected_answer_boundary: "回答 Q2/Q1 变化和可验证原因，不能声称活动因果。"
