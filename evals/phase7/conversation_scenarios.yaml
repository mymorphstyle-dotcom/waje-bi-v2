conversation_cases:
  - id: q2_q1_wajespecial_long_followup
    group: continuous_followup
    turns:
      - user: "Q2 相比 Q1 付费金额为什么变了？"
        expect:
          intent: "new_topic"
          topic_relation: "create"
          required_capabilities: ["driver_decomposition"]
          final_answer_contains: ["Q2", "Q1", "付费金额"]
      - user: "那具体哪些渠道贡献最大？"
        expect:
          intent: "follow_up"
          topic_relation: "inherit"
          required_capabilities: ["segment_contribution", "joint_attribution"]
          final_answer_contains: ["渠道", "贡献"]
      - user: "这些渠道里 WajeSpecial 是主要原因吗？"
        expect:
          intent: "follow_up"
          topic_relation: "inherit"
          required_capabilities: ["joint_attribution", "answer_verify"]
          final_answer_contains: ["WajeSpecial", "不能直接说", "原因"]
      - user: "如果去掉异常天还成立吗？"
        clarification_response: "按日粒度，移除贡献最大的正向日期后复算，不做订单级明细剔除。"
        expect:
          intent: "challenge"
          topic_relation: "inherit"
          required_capabilities: ["outlier_scan", "outlier_contribution"]
          allow_clarification: true
          final_answer_contains: ["移除", "方向"]
