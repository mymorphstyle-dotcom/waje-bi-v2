name: Gate 3 protected admission

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gate3-admission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build unprivileged admission candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: vnext
    env:
      GATE3_RELEASE_EPOCH: ${{ vars.GATE3_CANDIDATE_RELEASE_EPOCH }}
      GATE3_TRUST_POLICY_EPOCH: ${{ vars.GATE3_CANDIDATE_TRUST_POLICY_EPOCH }}
      GATE3_PREVIOUS_ADMISSION_SHA256: ${{ vars.GATE3_CANDIDATE_PREVIOUS_ADMISSION_SHA256 }}
      GATE3_CANDIDATE_AUTHORIZED_ATTESTATION_SHA256S_JSON: ${{ vars.GATE3_CANDIDATE_AUTHORIZED_ATTESTATION_SHA256S_JSON }}
      GATE3_CANDIDATE_AUTHORIZED_MANIFEST_SHA256S_JSON: ${{ vars.GATE3_CANDIDATE_AUTHORIZED_MANIFEST_SHA256S_JSON }}
      WAJE_GATE3_ENVIRONMENT: gate3-admission
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Python 3.12.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.13

      - name: Install Node.js 22.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: vnext/package-lock.json

      - name: Install uv 0.12.0
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: 0.12.0
          enable-cache: false

      - name: Bootstrap locked Python environment
        run: uv sync --frozen --no-install-project --python 3.12.13

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate candidate release
        run: |
          npm run check:contracts
          npm run check:github-deployment
          npm run test:bootstrap
          npm run check:evals:gate3

      - name: Build admission request
        run: |
          .venv/bin/python tools/build_gate3_github_admission_request.py \
            --output gate3-admission-request.json

      - name: Upload content-addressed request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate3-request-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: vnext/gate3-admission-request.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false

  attest:
    name: Attest externally approved release
    needs:
      - candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: gate3-admission
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download same-run candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gate3-request-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: admission-input

      - name: Enforce protected provider state
        shell: python
        env:
          APPROVED_ADMISSION_AUTHORITY_SHA256: ${{ secrets.GATE3_APPROVED_ADMISSION_AUTHORITY_SHA256 }}
          APPROVED_RELEASE_EPOCH: ${{ secrets.GATE3_APPROVED_RELEASE_EPOCH }}
          MINIMUM_TRUST_POLICY_EPOCH: ${{ secrets.GATE3_MINIMUM_TRUST_POLICY_EPOCH }}
          PREVIOUS_ADMISSION_SHA256: ${{ secrets.GATE3_PREVIOUS_ADMISSION_SHA256 }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("admission-input/gate3-admission-request.json")
          if path.is_symlink() or not path.is_file():
              raise SystemExit("admission request must be a regular file")
          if path.stat().st_size > 5 * 1024 * 1024:
              raise SystemExit("admission request exceeds size limit")

          def reject_duplicates(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"duplicate JSON key: {key}")
                  value[key] = item
              return value

          request = json.loads(
              path.read_text(encoding="utf-8"),
              object_pairs_hook=reject_duplicates,
          )
          expected_top_level = {
              "artifact_type",
              "artifact_version",
              "operation_id",
              "admission_authority_sha256",
              "repository",
              "workflow",
              "release_authority",
              "runtime_attestation",
              "authorization",
              "previous_admission_sha256",
              "created_at",
          }
          if set(request) != expected_top_level:
              raise SystemExit("admission request shape is not exact")
          repository = request["repository"]
          workflow = request["workflow"]
          release = request["release_authority"]
          runtime = request["runtime_attestation"]
          authorization = request["authorization"]
          exact_section_keys = {
              "repository": {
                  "name_with_owner",
                  "repository_id",
                  "repository_owner_id",
                  "source_revision",
                  "source_ref",
                  "event_name",
                  "environment",
              },
              "workflow": {
                  "workflow_path",
                  "workflow_revision",
                  "run_id",
                  "run_attempt",
                  "runner_environment",
              },
              "release_authority": {
                  "release_epoch",
                  "trust_policy_epoch",
                  "policy_sha256",
                  "authority_root_bundle_sha256",
                  "verifier_release_sha256",
                  "evaluated_artifact_hashes",
              },
              "runtime_attestation": {
                  "python_version",
                  "python_executable_sha256",
                  "node_version",
                  "node_executable_sha256",
                  "npm_version",
                  "npm_executable_sha256",
                  "uv_version",
                  "uv_executable_sha256",
                  "dependency_inventory_sha256",
                  "import_inventory_sha256",
                  "source_tree_sha256",
              },
              "authorization": {
                  "authorized_attestation_sha256s",
                  "authorized_manifest_sha256s",
              },
          }
          actual_sections = {
              "repository": repository,
              "workflow": workflow,
              "release_authority": release,
              "runtime_attestation": runtime,
              "authorization": authorization,
          }
          for section_name, expected_keys in exact_section_keys.items():
              if set(actual_sections[section_name]) != expected_keys:
                  raise SystemExit(
                      f"{section_name} shape is not exact"
                  )
          expected = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "repository_id": int(os.environ["GITHUB_REPOSITORY_ID"]),
              "repository_owner_id": int(
                  os.environ["GITHUB_REPOSITORY_OWNER_ID"]
              ),
              "source_revision": os.environ["GITHUB_SHA"],
              "source_ref": "refs/heads/main",
              "event_name": "push",
              "environment": "gate3-admission",
              "workflow_path": (
                  ".github/workflows/gate3-protected-admission.yml"
              ),
              "workflow_revision": os.environ["GITHUB_WORKFLOW_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner_environment": "github-hosted",
          }
          actual = {
              "repository": repository["name_with_owner"],
              "repository_id": repository["repository_id"],
              "repository_owner_id": repository["repository_owner_id"],
              "source_revision": repository["source_revision"],
              "source_ref": repository["source_ref"],
              "event_name": repository["event_name"],
              "environment": repository["environment"],
              "workflow_path": workflow["workflow_path"],
              "workflow_revision": workflow["workflow_revision"],
              "run_id": workflow["run_id"],
              "run_attempt": workflow["run_attempt"],
              "runner_environment": workflow["runner_environment"],
          }
          if actual != expected:
              raise SystemExit("request identity does not match protected run")
          if request["operation_id"] != (
              f"gate3-e0:{expected['run_id']}:{expected['run_attempt']}"
          ):
              raise SystemExit("operation identity does not match run")

          approved_hash = os.environ.get(
              "APPROVED_ADMISSION_AUTHORITY_SHA256", ""
          )
          if len(approved_hash) != 64:
              raise SystemExit("approved admission hash is unprovisioned")
          if request["admission_authority_sha256"] != approved_hash:
              raise SystemExit(
                  "complete admission authority is not externally approved"
              )
          if release["release_epoch"] != int(
              os.environ["APPROVED_RELEASE_EPOCH"]
          ):
              raise SystemExit("release epoch is not current")
          if release["trust_policy_epoch"] < int(
              os.environ["MINIMUM_TRUST_POLICY_EPOCH"]
          ):
              raise SystemExit("trust policy epoch has rolled back")
          previous = os.environ.get("PREVIOUS_ADMISSION_SHA256") or None
          if request["previous_admission_sha256"] != previous:
              raise SystemExit("admission predecessor is stale")

          authority_payload = {
              "release_authority": release,
              "runtime_attestation": runtime,
              "authorization": {
                  "authorized_attestation_sha256s": sorted(
                      authorization["authorized_attestation_sha256s"]
                  ),
                  "authorized_manifest_sha256s": sorted(
                      authorization["authorized_manifest_sha256s"]
                  ),
              },
          }
          canonical = json.dumps(
              authority_payload,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          if hashlib.sha256(canonical).hexdigest() != approved_hash:
              raise SystemExit(
                  "approved admission authority hash is stale"
              )

      - name: Attest exact admission request
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: admission-input/gate3-admission-request.json

      - name: Upload immutable verification bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate3-admission-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            admission-input/gate3-admission-request.json
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
